  }

  function renderPregled() {
    setViews('pregled');
    clearNode(pregledView);

    var result = readValidStore();
    if (!result.ok) {
      renderSeasonalReadFailure(pregledView, result);
      return;
    }
    var snapshot;
    try {
      snapshot = buildSeasonalSnapshot(result.store, result.catalog, localTodayYmd());
    } catch (e) {
      renderSeasonalSnapshotFailure(pregledView, e);
      return;
    }
    var activePlantList = activePlants(result.store.plants);
    if (activePlantList.length === 0) {
      pregledView.appendChild(makeEl('p', 'v2-plants-empty', result.store.plants.length === 0 ? 'Dodaj voćku kako bi se prikazale sezonske radnje.' : 'Nema aktivnih voćki za sezonski prikaz.'));
      return;
    }

    var displayGroups = filterSeasonalGroupsForYoungTreeRelevance(snapshot.groups, snapshot.today);
    appendPregledHero(pregledView, snapshot, displayGroups);
    var youngTreeCurrentGroups = youngTreeCurrentContextGroups(activePlantList, snapshot.today);
    var b2Visibility = filterB2VisibilityForYoungTreeRelevance(b2VisibilityForPlants(activePlantList, snapshot.today), snapshot.today);
    var currentGroups = displayGroups.filter(groupHasLiveState);
    var missedGroups = displayGroups.filter(groupHasMissedState);
    var upcomingSnapshot = {
      today: snapshot.today,
      groups: displayGroups
    };
    var upcomingGroups = upcomingGroupsForPregled(upcomingSnapshot);
    appendSeasonalSection(pregledView, 'Sada aktualno', currentGroups, 'Trenutno nema aktualnih sezonskih radnji.', 'current', true);
    appendSeasonalSection(pregledView, 'Za provjeru: nema evidencije', missedGroups, 'Nema sezonskih radnji bez evidencije.', 'missed', true);
    appendSeasonalSection(pregledView, 'Uskoro', upcomingGroups, 'Nema skorih sezonskih radnji.', 'upcoming', true);
    appendB2PregledSection(pregledView, b2Visibility.current);
    appendYoungTreePregledSection(pregledView, youngTreeCurrentGroups);
    if (currentGroups.length === 0 && missedGroups.length === 0 && upcomingGroups.length === 0 && b2Visibility.current.length === 0 && youngTreeCurrentGroups.length === 0) {
      pregledView.appendChild(makeEl('p', 'v2-plants-empty', 'Za ovaj dio sezone nema prikazanih sezonskih radnji.'));
    }
  }

  function endOfMonthYmd(year, month) {
    return formatYmdLocal(new Date(year, month, 0));
  }

  function groupOverlapsMonth(group, month) {
    var start = ymdFromMonthDay(group.cycle_year, { month: month, day: 1 });
    var end = endOfMonthYmd(group.cycle_year, month);
    return group.effective_open <= end && group.effective_close >= start;
  }

  function renderKalendar() {
    setViews('kalendar');
    clearNode(calendarView);
    var year = Number(localTodayYmd().slice(0, 4));
    appendSeasonalHeader(calendarView, 'Kalendar', 'kalendar', 'Sezona ' + year + '.');

    var result = readValidStore();
    if (!result.ok) {
      renderSeasonalReadFailure(calendarView, result);
      return;
    }
    var snapshot;
    try {
      snapshot = buildSeasonalSnapshot(result.store, result.catalog, localTodayYmd());
    } catch (e) {
      renderSeasonalSnapshotFailure(calendarView, e);
      return;
    }
    var activePlantList = activePlants(result.store.plants);
    var displayGroups = filterSeasonalGroupsForYoungTreeRelevance(snapshot.groups, snapshot.today);
    var b2Visibility = filterB2VisibilityForYoungTreeRelevance(b2VisibilityForPlants(activePlantList, snapshot.today), snapshot.today);
    var youngTreeContextGroups = buildYoungTreeContextGroups(activePlantList, snapshot.today);
    if (activePlantList.length === 0) {
      calendarView.appendChild(makeEl('p', 'v2-plants-empty', result.store.plants.length === 0 ? 'Dodaj voćku kako bi se prikazao sezonski kalendar.' : 'Nema aktivnih voćki za sezonski kalendar.'));
      return;
    }

    for (var m = 1; m <= 12; m++) {
      var month = makeEl('section', 'v2-calendar-month');
      month.id = 'v2CalendarMonth' + m;
      month.appendChild(makeEl('h3', '', MONTH_NAMES_HR[m - 1]));
      month.appendChild(makeEl('p', 'v2-seasonal-meta', 'Sezonske radnje'));
      var monthGroups = displayGroups.filter(function (group) { return groupOverlapsMonth(group, m); });
      if (monthGroups.length === 0) {
        month.appendChild(makeEl('p', 'v2-plants-empty', 'Nema sezonskih radnji u ovom mjesecu.'));
      } else {
        var list = makeEl('div', 'v2-seasonal-list');
        for (var g = 0; g < monthGroups.length; g++) appendSeasonalCard(list, monthGroups[g], 'calendar', true);
        month.appendChild(list);
      }
      var youngMonthGroups = youngTreeContextGroups.filter(function (group) { return youngTreeGroupOverlapsMonth(group, m); });
      appendYoungTreeCalendarSection(month, youngMonthGroups);
      var b2MonthGroups = b2Visibility.all.filter(function (group) { return b2GroupOverlapsMonth(group, m); });
      appendB2CalendarSection(month, b2MonthGroups);
      calendarView.appendChild(month);
    }

    var currentMonth = Number(localTodayYmd().slice(5, 7));
    setTimeout(function () {
      var node = document.getElementById('v2CalendarMonth' + currentMonth);
      if (node && typeof node.scrollIntoView === 'function') node.scrollIntoView({ block: 'start' });
    }, 0);
  }

  var SEASONAL_DETAIL_BASELINE_NOTE_HR = 'Datumi su okvirni podsjetnik. Stvarno stanje voćke i lokalni uvjeti imaju prednost pred datumom: u toplijim krajevima radnje mogu krenuti ranije, a u hladnijim krajevima kasnije.';

  function renderSeasonalActionDetail(route) {
    setViews('seasonal_action');
    clearNode(seasonalActionView);

    var result = readValidStore();
    if (!result.ok) {
      appendSeasonalHeader(seasonalActionView, 'Sezonska radnja', 'kalendar');
      renderSeasonalReadFailure(seasonalActionView, result);
      return;
    }
    var snapshot;
    var found;
    try {
      snapshot = buildSeasonalSnapshot(result.store, result.catalog, localTodayYmd());
      found = findSeasonalGroup(snapshot, route);
      found = filterSeasonalGroupsForYoungTreeRelevance(found ? [found] : [], snapshot.today)[0] || null;
    } catch (e) {
      appendSeasonalHeader(seasonalActionView, 'Sezonska radnja', 'kalendar');
      renderSeasonalSnapshotFailure(seasonalActionView, e);
      return;
    }
    if (!found) {
      appendSeasonalHeader(seasonalActionView, 'Sezonska radnja', 'kalendar');
      seasonalActionView.appendChild(makeEl('p', 'v2-plants-empty', 'Sezonska radnja nije pronađena.'));
      return;
    }

    appendSeasonalHeader(seasonalActionView, actionWindowLabel(found.def, result.catalog), 'kalendar');
    var back = makeEl('button', 'v2-plants-secondary', 'Natrag na Kalendar');
    back.type = 'button';
    back.addEventListener('click', function () { location.hash = '#v2/kalendar'; });
    seasonalActionView.appendChild(back);

    var summary = makeEl('article', 'v2-seasonal-card');
    summary.appendChild(makeEl('span', 'v2-seasonal-meta', seasonalDetailDateLine(found, snapshot.today)));
    summary.appendChild(makeEl('span', 'v2-seasonal-meta', SEASONAL_DETAIL_BASELINE_NOTE_HR));
    var stateLine = seasonalDetailStateLine(found);
    if (stateLine) summary.appendChild(makeEl('span', 'v2-seasonal-meta', stateLine));
    summary.appendChild(makeEl('span', 'v2-seasonal-meta', seasonalDetailPlantScopeLine(found)));
    var evidenceSummary = seasonalDetailEvidenceSummary(found);
    if (evidenceSummary) summary.appendChild(makeEl('span', 'v2-seasonal-note', evidenceSummary));
    var gate = uniformGateState(found);
    if (gate) summary.appendChild(makeEl('span', 'v2-seasonal-note', 'Uvjet: ' + gate + '.'));
    var capture = makeEl('button', 'v2-plants-primary', 'Dodaj evidenciju');
    capture.type = 'button';
    capture.addEventListener('click', function () { location.hash = activityAddRoute(found); });
    summary.appendChild(capture);
    seasonalActionView.appendChild(summary);

    appendCanonicalTextSection(seasonalActionView, 'Napomene', canonicalTextLines(found.def.notes));
    if (isSprayActionType(found.def.action_type) && Array.isArray(result.catalog.spray_safety_notes)) {
      appendCanonicalTextSection(seasonalActionView, 'Sigurnost prskanja', result.catalog.spray_safety_notes.slice());
    }

    var entries = effectiveActivityEntries(result.store, result.catalog);
    var evidence = makeEl('section', 'v2-seasonal-section');
    evidence.appendChild(makeEl('h3', '', 'Evidencija po voćkama'));
    var list = makeEl('div', 'v2-seasonal-list');
    for (var i = 0; i < found.occurrences.length; i++) {
      var occurrence = found.occurrences[i];
      var card = makeEl('article', 'v2-seasonal-card');
      card.appendChild(makeEl('p', 'v2-seasonal-card-title', plantTitle(occurrence.plant)));
      card.appendChild(makeEl('span', 'v2-seasonal-status', stateDisplayLabel(occurrence.state)));
      card.appendChild(makeEl('span', 'v2-seasonal-meta', seasonalDetailDateLine(found, snapshot.today)));
      var occurrenceGate = gateStateForDisplay(occurrence.def, occurrence.gate_state);
      if (occurrenceGate) card.appendChild(makeEl('span', 'v2-seasonal-note', 'Uvjet: ' + occurrenceGate + '.'));
      var matchingEntries = matchingActivityEntriesForOccurrence(entries, occurrence);
      if (matchingEntries.length === 0) {
        card.appendChild(makeEl('span', 'v2-seasonal-note', noActivityEvidenceLine(occurrence, snapshot)));
      } else {
        for (var e = 0; e < matchingEntries.length; e++) {
          card.appendChild(makeEl('span', 'v2-seasonal-note', activityEvidenceLine(matchingEntries[e], occurrence)));
          if (hasOwnKey(matchingEntries[e].effective, 'notes')) {
            card.appendChild(makeEl('span', 'v2-seasonal-note', 'Bilješka: ' + matchingEntries[e].effective.notes));
          }
        }
      }
      list.appendChild(card);
    }
    evidence.appendChild(list);
    seasonalActionView.appendChild(evidence);

    var diary = makeEl('section', 'v2-seasonal-section');
    diary.appendChild(makeEl('h3', '', 'Dnevnik'));
    var diaryLink = makeEl('button', 'v2-plants-secondary', 'Otvori u Dnevniku voćnjaka');
    diaryLink.type = 'button';
    diaryLink.addEventListener('click', function () { location.hash = '#v2/diary'; });
    diary.appendChild(diaryLink);
    seasonalActionView.appendChild(diary);
  }

  function diaryGroupKey(entry) {
    var e = entry.effective;
    var groupId = hasOwnKey(e, 'activity_group_id') ? e.activity_group_id : 'single:' + e.activity_id;
    var notes = hasOwnKey(e, 'notes') ? e.notes : '';
    return [groupId, e.window_def_id, e.catalog_version, e.action_type, e.occurred_on, e.status, notes].join('|');
  }

  function activityEntriesForPlant(entries, plantId) {
    return entries.filter(function (entry) {
      return entry.effective.plant_id === plantId;
    });
  }

  function groupDiaryEntries(entries) {
    var groups = Object.create(null);
    for (var i = 0; i < entries.length; i++) {
      var key = diaryGroupKey(entries[i]);
      if (!groups[key]) groups[key] = [];
      groups[key].push(entries[i]);
    }
    var groupList = Object.keys(groups).map(function (key) { return groups[key]; });
    groupList.sort(function (a, b) {
      var ae = a[0].effective;
      var be = b[0].effective;
      if (ae.occurred_on !== be.occurred_on) return be.occurred_on.localeCompare(ae.occurred_on);
      return be.recorded_at.localeCompare(ae.recorded_at);
    });
    return groupList;
  }

  function appendDiaryGroupCard(parent, group, result, options) {
    var showCorrectionActions = !options || options.showCorrectionActions !== false;
    var sample = group[0].effective;
    var def = findActionWindow(result.catalog, sample.window_def_id);
    var card = makeEl('article', 'v2-diary-card');
    var title = makeEl('p', 'v2-diary-title', formatDateYmd(sample.occurred_on) + ' · ' + actionWindowLabel(def, result.catalog));
    if (group.some(function (entry) { return entry.corrected; })) title.appendChild(makeEl('span', 'v2-diary-corrected', 'ispravljeno'));
    card.appendChild(title);
    var plantNames = group.map(function (entry) {
      var plant = findPlant(result.store.plants, entry.effective.plant_id);
      return plant ? plantTitleWithArchiveMarker(plant) : entry.effective.plant_id;
    });
    var plantMeta = group.length === 1 ? plantNames[0] : plantCountText(group.length);
    card.appendChild(makeEl('span', 'v2-diary-meta', statusLabel(sample.status) + ' · ' + plantMeta));
    if (hasOwnKey(sample, 'notes')) card.appendChild(makeEl('span', 'v2-diary-note', 'Bilješka: ' + sample.notes));
    var estimated = group.some(function (entry) {
      var plant = findPlant(result.store.plants, entry.effective.plant_id);
      var activityDef = findActionWindow(result.catalog, entry.effective.window_def_id);
      return plant && activityDef && usesEstimatedMidFallback(plant, activityDef, result.catalog);
    });
    if (estimated) card.appendChild(makeEl('small', 'v2-diary-meta', ESTIMATED_MID_FALLBACK_TEXT));
    if (showCorrectionActions) {
      var correctionActions = makeEl('div', 'v2-diary-plant-actions');
      for (var p = 0; p < group.length; p++) {
        var button = makeEl('button', 'v2-plants-secondary', group.length > 1 ? 'Ispravi — ' + plantNames[p] : 'Ispravi zapis');
        button.type = 'button';
        button.dataset.activityId = group[p].original.activity_id;
        button.addEventListener('click', function (event) {
          location.hash = activityCorrectionRoute(event.currentTarget.dataset.activityId);
        });
        correctionActions.appendChild(button);
      }
      card.appendChild(correctionActions);
    }
    parent.appendChild(card);
  }

  function appendDiaryGroups(parent, groupList, result, options) {
    for (var g = 0; g < groupList.length; g++) {
      appendDiaryGroupCard(parent, groupList[g], result, options);
    }
  }

  function historyObservationEntriesForPlant(entries, plantId) {
    return entries.filter(function (entry) {
      return !plantId || entry.effective.plant_id === plantId;
    });
  }

  function observationDiaryItem(entry) {
    var observation = entry.effective;
    var obsType;
    if (observation.kind === 'trap') obsType = 'trap_observation';
    else if (observation.kind === 'stage_obs') obsType = 'stage_observation';
    else if (observation.kind === 'scouting') obsType = 'scouting_observation';
    else obsType = 'note_observation';
    return {
      type: obsType,
      date: observation.observed_on,
      recorded_at: entry.original.recorded_at,
      id: entry.original.observation_id,
      entry: entry
    };
  }

  function groupedObservationDiaryItem(group) {
    var sample = group[0].effective;
    var groupType = 'note_observation_group';
    if (sample.kind === 'stage_obs') groupType = 'stage_observation_group';
    if (sample.kind === 'scouting') groupType = 'scouting_observation_group';
    return {
      type: groupType,
      date: sample.observed_on,
      recorded_at: group[0].original.recorded_at,
      id: group[0].original.observation_group_id,
      entries: group
    };
  }

  function observationDiaryItems(entries, plantId) {
    if (plantId) return entries.map(observationDiaryItem);
    var groups = Object.create(null);
    var items = [];
    for (var i = 0; i < entries.length; i++) {
      var observation = entries[i].original;
      var groupable = (observation.kind === 'note' || observation.kind === 'stage_obs' || observation.kind === 'scouting') && hasOwnKey(observation, 'observation_group_id');
      if (!groupable) {
        items.push(observationDiaryItem(entries[i]));
        continue;
      }
      if (!groups[observation.observation_group_id]) groups[observation.observation_group_id] = [];
      groups[observation.observation_group_id].push(entries[i]);
    }
    var groupIds = Object.keys(groups);
    for (var g = 0; g < groupIds.length; g++) {
      var group = groups[groupIds[g]];
      if (group.length > 1) items.push(groupedObservationDiaryItem(group));
      else items.push(observationDiaryItem(group[0]));
    }
    return items;
  }

  function diaryItemsForResult(result, plantId) {
    var entries = effectiveActivityEntries(result.store, result.catalog);
    if (plantId) entries = activityEntriesForPlant(entries, plantId);
    var groups = groupDiaryEntries(entries);
    var items = groups.map(function (group) {
      var sample = group[0].effective;
      return {
        type: 'activity_group',
        date: sample.occurred_on,
        recorded_at: sample.recorded_at,
        id: hasOwnKey(sample, 'activity_group_id') ? sample.activity_group_id : sample.activity_id,
        group: group
      };
    });
    var observationEntries = historyObservationEntriesForPlant(effectiveObservationEntries(result.store), plantId);
    items = items.concat(observationDiaryItems(observationEntries, plantId));
    items.sort(function (a, b) {
      if (a.date !== b.date) return b.date.localeCompare(a.date);
      if (a.recorded_at !== b.recorded_at) return b.recorded_at.localeCompare(a.recorded_at);
      return b.id.localeCompare(a.id);
    });
    return items;
  }

  function cloneCorrectionValues(value) {
    if (Array.isArray(value)) {
      var arr = [];
      for (var i = 0; i < value.length; i++) arr.push(cloneCorrectionValues(value[i]));
      return arr;
    }
    if (value && typeof value === 'object') {
      var out = {};
      var keys = Object.keys(value);
      for (var j = 0; j < keys.length; j++) out[keys[j]] = cloneCorrectionValues(value[keys[j]]);
      return out;
    }
    return value;
  }

  function observationCorrectionTitle(entry, result, entries) {
    var observation = entry.effective;
    var scope = entries && entries.length > 1 ? observationPlantScopeText(entries, result) : '';
    if (!scope) {
      var plant = findPlant(result.store.plants, observation.plant_id);
      scope = plant ? plantTitleWithArchiveMarker(plant) : observation.plant_id;
    }
    if (observation.kind === 'trap') {
      var trapSource = typeof trapCaptureSourceById === 'function' ? trapCaptureSourceById(observation.payload.source_entry_id) : null;
      return formatDateYmd(observation.observed_on) + ' · Klopka — ' + (trapSource ? trapSource.target_label_hr : observation.payload.source_entry_id) + ' · ' + scope;
    }
    if (observation.kind === 'stage_obs') {
      var stageEntry = typeof stageDiaryEntryByCode === 'function' ? stageDiaryEntryByCode(observation.payload.stage_code) : null;
      return formatDateYmd(observation.observed_on) + ' · Faza razvoja — ' + (stageEntry ? stageEntry.label_hr : observation.payload.stage_code) + ' · ' + scope;
    }
    if (observation.kind === 'scouting') {
      var scoutingSource = typeof scoutingCaptureSourceById === 'function' ? scoutingCaptureSourceById(observation.payload.source_entry_id) : null;
      return formatDateYmd(observation.observed_on) + ' · Vizualni pregled — ' + (scoutingSource ? scoutingSource.target_label_hr : observation.payload.source_entry_id) + ' · ' + scope;
    }
    return formatDateYmd(observation.observed_on) + ' · Opažanje · ' + scope;
  }

  function observationCorrectionPlantOptions(result, observation, effectivePlantId) {
    var candidates = [];
    var source = null;
    if (observation.kind === 'trap') source = typeof trapCaptureSourceById === 'function' ? trapCaptureSourceById(observation.payload.source_entry_id) : null;
    if (observation.kind === 'scouting') source = typeof scoutingCaptureSourceById === 'function' ? scoutingCaptureSourceById(observation.payload.source_entry_id) : null;
    for (var i = 0; i < result.store.plants.length; i++) {
      var plant = result.store.plants[i];
      if (source && plant.species !== source.species) continue;
      candidates.push(plant);
    }
    candidates.sort(function (a, b) {
      if (a.plant_id === effectivePlantId) return -1;
      if (b.plant_id === effectivePlantId) return 1;
      var orderA = typeof a.stable_order === 'number' && isFinite(a.stable_order) ? a.stable_order : Number.MAX_SAFE_INTEGER;
      var orderB = typeof b.stable_order === 'number' && isFinite(b.stable_order) ? b.stable_order : Number.MAX_SAFE_INTEGER;
      if (orderA !== orderB) return orderA - orderB;
      return plantTitle(a).localeCompare(plantTitle(b), 'hr');
    });
    return candidates;
  }

    noneChoice.appendChild(document.createTextNode('Nije primijećeno'));
    parent.appendChild(noneChoice);

    var presentChoice = makeEl('label', 'v2-plants-check');
    var presentRadio = document.createElement('input');
    presentRadio.type = 'radio';
    presentRadio.name = radioName;
    presentRadio.value = 'present';
    presentRadio.checked = observation.payload.finding.value;
    presentChoice.appendChild(presentRadio);
    presentChoice.appendChild(document.createTextNode('Primijećeno'));
    parent.appendChild(presentChoice);

    var selected = Object.create(null);
    for (var s = 0; s < observation.payload.selected_sign_keys.length; s++) selected[observation.payload.selected_sign_keys[s]] = true;
    var signWrap = makeEl('div', 'v2-plants-field');
    signWrap.appendChild(makeEl('label', '', 'Vidljivi znakovi'));
    var signInputs = [];
    var choices = source && Array.isArray(source.sign_choices) ? source.sign_choices : [];
    for (var i = 0; i < choices.length; i++) {
      var sign = choices[i];
      var signChoice = makeEl('label', 'v2-plants-check');
      var signInput = document.createElement('input');
      signInput.type = 'checkbox';
      signInput.name = 'v2ObservationCorrectionSigns_' + observation.observation_id;
      signInput.value = sign.sign_key;
      signInput.checked = !!selected[sign.sign_key];
      signChoice.appendChild(signInput);
      signChoice.appendChild(document.createTextNode(sign.label_hr));
      signWrap.appendChild(signChoice);
      signInputs.push(signInput);
    }
    parent.appendChild(signWrap);
    return {
      noneRadio: noneRadio,
      presentRadio: presentRadio,
      signWrap: signWrap,
      signInputs: signInputs
    };
  }

  function appendScoutingNoteCorrectionControls(parent, observation) {
    var radioName = 'v2ObservationCorrectionScoutingNote_' + observation.observation_id;
    var hasNote = hasOwnKey(observation.payload, 'note');
    var textChoice = makeEl('label', 'v2-plants-check');
    var textRadio = document.createElement('input');
    textRadio.type = 'radio';
    textRadio.name = radioName;
    textRadio.value = 'text';
    textRadio.checked = hasNote;
    textChoice.appendChild(textRadio);
    textChoice.appendChild(document.createTextNode('Nova bilješka'));
    parent.appendChild(textChoice);

    var noneChoice = makeEl('label', 'v2-plants-check');
    var noneRadio = document.createElement('input');
    noneRadio.type = 'radio';
    noneRadio.name = radioName;
    noneRadio.value = 'none';
    noneRadio.checked = !hasNote;
    noneChoice.appendChild(noneRadio);
    noneChoice.appendChild(document.createTextNode('Bez bilješke'));
    parent.appendChild(noneChoice);

    var noteText = document.createElement('textarea');
    noteText.maxLength = 1000;
    noteText.value = hasNote ? observation.payload.note : '';
    appendField(parent, 'v2ObservationCorrectionScoutingNoteText', 'Bilješka pregleda', noteText);
    return {
      textRadio: textRadio,
      noneRadio: noneRadio,

  function selectedCorrectionSignKeys(inputs) {
    var selected = [];
    for (var i = 0; i < inputs.length; i++) {
      if (inputs[i].checked) selected.push(inputs[i].value);
    }
    return selected;
  }

  function refreshObservationCorrectionEnabled(fields) {
    if (fields.dateInput) fields.dateInput.disabled = !fields.dateCheck.checked;
    if (fields.plantSelect) fields.plantSelect.disabled = !fields.plantCheck.checked;
    if (fields.noteText) fields.noteText.disabled = !fields.noteTextCheck.checked;
    if (fields.trapCountInput) fields.trapCountInput.disabled = !fields.trapCountCheck.checked;
    if (fields.stageSelect) fields.stageSelect.disabled = !fields.stageCheck.checked;
    if (fields.scoutingNoneRadio) {
      var resultEnabled = fields.scoutingResultCheck.checked;
      fields.scoutingNoneRadio.disabled = !resultEnabled;
      fields.scoutingPresentRadio.disabled = !resultEnabled;
      var signsEnabled = resultEnabled && fields.scoutingPresentRadio.checked;
      fields.scoutingSignWrap.hidden = !signsEnabled;
      for (var s = 0; s < fields.scoutingSignInputs.length; s++) fields.scoutingSignInputs[s].disabled = !signsEnabled;
    }
    if (fields.scoutingNoteTextRadio) {
      var noteEnabled = fields.scoutingNoteCheck.checked;
      fields.scoutingNoteTextRadio.disabled = !noteEnabled;
      fields.scoutingNoteNoneRadio.disabled = !noteEnabled;
      fields.scoutingNoteText.disabled = !noteEnabled || !fields.scoutingNoteTextRadio.checked;
    }
  }

  function bindObservationCorrectionRefresh(fields) {
    var checks = ['dateCheck','plantCheck','noteTextCheck','trapCountCheck','stageCheck','scoutingResultCheck','scoutingNoteCheck'];
    for (var i = 0; i < checks.length; i++) {
      if (fields[checks[i]]) fields[checks[i]].addEventListener('change', function () { refreshObservationCorrectionEnabled(fields); });
    }
    if (fields.scoutingNoneRadio) fields.scoutingNoneRadio.addEventListener('change', function () { refreshObservationCorrectionEnabled(fields); });
    if (fields.scoutingPresentRadio) fields.scoutingPresentRadio.addEventListener('change', function () { refreshObservationCorrectionEnabled(fields); });
    if (fields.scoutingNoteTextRadio) fields.scoutingNoteTextRadio.addEventListener('change', function () { refreshObservationCorrectionEnabled(fields); });
    if (fields.scoutingNoteNoneRadio) fields.scoutingNoteNoneRadio.addEventListener('change', function () { refreshObservationCorrectionEnabled(fields); });
    refreshObservationCorrectionEnabled(fields);
  }

  function renderObservationCorrection(route) {
    setViews('correction');
    clearNode(correctionForm);

    var result = readValidStore();
    var back = makeEl('button', 'v2-plants-secondary', 'Natrag na Dnevnik');
    back.type = 'button';
    back.addEventListener('click', function () { location.hash = '#v2/diary'; });
    correctionForm.appendChild(back);
    correctionForm.appendChild(makeEl('h2', '', 'Ispravi zapis'));
    correctionForm.appendChild(makeEl('p', 'v2-diary-meta', 'Ispravak se sprema kao novi zapis. Originalni zapis ostaje vidljiv u Dnevniku.'));
    var message = makeEl('p', 'v2-plants-error');
    message.hidden = true;
    correctionForm.appendChild(message);
    if (!result.ok) {
      message.textContent = result.error;
      message.hidden = false;
      currentCorrectionFields = null;
      return;
    }

    var allEntries = effectiveObservationEntries(result.store);
    var grouped = route.record_type === 'observation_group';
    var entries;
    if (grouped) {
      entries = findEffectiveObservationGroup(allEntries, route.observation_group_id);
      if (!groupedObservationCorrectionAvailable(entries)) {
        correctionForm.appendChild(makeEl('p', 'v2-plants-empty', 'Ispravak nije dostupan za ovaj grupni zapis.'));
        currentCorrectionFields = null;
        return;
      }
    } else {
      var entry = findEffectiveObservationEntry(allEntries, route.observation_id);
      if (!entry || hasOwnKey(entry.original, 'observation_group_id')) {
        correctionForm.appendChild(makeEl('p', 'v2-plants-empty', 'Zapis nije pronađen.'));
        currentCorrectionFields = null;
        return;
      }
      entries = [entry];
    }

    var sampleEntry = entries[0];
    var sample = sampleEntry.effective;
    correctionForm.appendChild(makeEl('p', 'v2-diary-meta', observationCorrectionTitle(sampleEntry, result, entries)));
    if (grouped) correctionForm.appendChild(makeEl('p', 'v2-plants-hint', 'Ispravak vrijedi za sve voćke u ovom grupnom zapisu.'));

    var fields = {
      recordType: grouped ? 'observation_group' : 'observation',
      grouped: grouped,
      groupId: grouped ? sampleEntry.original.observation_group_id : null,
      observationId: grouped ? null : sampleEntry.original.observation_id,
      kind: sample.kind,
      message: message
    };

    if (!grouped) {
      fields.dateCheck = appendCorrectionCheck(correctionForm, 'Krivi datum');
      fields.dateInput = document.createElement('input');
      fields.dateInput.type = 'date';
      fields.dateInput.value = sample.observed_on;
      appendField(correctionForm, 'v2ObservationCorrectionDate', 'Novi datum', fields.dateInput);

      fields.plantCheck = appendCorrectionCheck(correctionForm, 'Kriva voćka');
      fields.plantSelect = document.createElement('select');
      var plantOptions = observationCorrectionPlantOptions(result, sampleEntry.original, sample.plant_id);
      for (var p = 0; p < plantOptions.length; p++) {
        fields.plantSelect.appendChild(makeOption(plantOptions[p].plant_id, plantTitleWithArchiveMarker(plantOptions[p])));
      }
      fields.plantSelect.value = sample.plant_id;
      appendField(correctionForm, 'v2ObservationCorrectionPlant', 'Nova voćka', fields.plantSelect);
    }

    if (sample.kind === 'note') {
      fields.noteTextCheck = appendCorrectionCheck(correctionForm, 'Bilješka');
      fields.noteText = document.createElement('textarea');
      fields.noteText.value = sample.payload.text;
      appendField(correctionForm, 'v2ObservationCorrectionNoteText', 'Nova bilješka', fields.noteText);
    } else if (sample.kind === 'trap' && !grouped) {
      fields.trapCountCheck = appendCorrectionCheck(correctionForm, 'Krivi broj ulova');
      fields.trapCountInput = document.createElement('input');
      fields.trapCountInput.type = 'number';
      fields.trapCountInput.min = '0';
      fields.trapCountInput.step = '1';
      fields.trapCountInput.inputMode = 'numeric';
      fields.trapCountInput.value = String(sample.payload.count);
      appendField(correctionForm, 'v2ObservationCorrectionTrapCount', 'Broj ulova', fields.trapCountInput);
    } else if (sample.kind === 'stage_obs') {
      fields.stageCheck = appendCorrectionCheck(correctionForm, 'Kriva faza razvoja');
      fields.stageSelect = appendStageCorrectionSelect(correctionForm, sample.payload.stage_code);
    } else if (sample.kind === 'scouting') {
      var source = typeof scoutingCaptureSourceById === 'function' ? scoutingCaptureSourceById(sample.payload.source_entry_id) : null;
      fields.scoutingResultCheck = appendCorrectionCheck(correctionForm, 'Krivi nalaz');
      var resultControls = appendScoutingResultCorrectionControls(correctionForm, source, sample);
      fields.scoutingNoneRadio = resultControls.noneRadio;
      fields.scoutingPresentRadio = resultControls.presentRadio;
      fields.scoutingSignWrap = resultControls.signWrap;
      fields.scoutingSignInputs = resultControls.signInputs;

      fields.scoutingNoteCheck = appendCorrectionCheck(correctionForm, 'Bilješka pregleda');
      var noteControls = appendScoutingNoteCorrectionControls(correctionForm, sample);
      fields.scoutingNoteTextRadio = noteControls.textRadio;
      fields.scoutingNoteNoneRadio = noteControls.noneRadio;
      fields.scoutingNoteText = noteControls.noteText;
    }

    var explanation = document.createElement('textarea');
    appendField(correctionForm, 'v2ObservationCorrectionExplanation', 'Bilješka ispravka', explanation, 'Što si točno ispravio/la i zašto? Neobavezno.');
    fields.explanation = explanation;

    var actions = makeEl('div', 'v2-plants-actions');
    var save = makeEl('button', 'v2-plants-primary', 'Spremi ispravak');
    save.type = 'submit';
    var cancel = makeEl('button', 'v2-plants-secondary', 'Odustani');
    cancel.type = 'button';
    cancel.addEventListener('click', function () { location.hash = '#v2/diary'; });
    actions.appendChild(save);
    actions.appendChild(cancel);
    correctionForm.appendChild(actions);

    currentCorrectionFields = fields;
    bindObservationCorrectionRefresh(fields);
  }

  function renderCorrection(route) {
    if (route.record_type === 'observation' || route.record_type === 'observation_group') renderObservationCorrection(route);
    else renderActivityCorrection(route);
  }

  function saveCurrentActivityCorrection() {
    var fields = currentCorrectionFields;
    if (!fields) return;
    fields.message.hidden = true;
    var current = readValidStore();
    if (!current.ok) {
      fields.message.textContent = current.error;
      fields.message.hidden = false;
      return;
    }
    var types = [];
    var values = {};
    if (fields.dateCheck.checked) {
      if (!fields.dateInput.value) {
        fields.message.textContent = 'Novi datum je obavezan.';
        fields.message.hidden = false;
        return;
      }
      types.push('date');
      values.occurred_on = fields.dateInput.value;
    }
    if (fields.plantCheck.checked) {
      types.push('plant');
      values.plant_id = fields.plantSelect.value;
    }
    if (fields.windowCheck.checked) {
      var def = findActionWindow(current.catalog, fields.windowSelect.value);
      if (!def) {
        fields.message.textContent = 'Odaberi novu radnju iz kataloga.';
        fields.message.hidden = false;
        return;
      }
      types.push('window');
      values.window_def_id = def.window_def_id;
      values.catalog_version = def.catalog_id;
      values.action_type = def.action_type;
    }
    if (fields.statusCheck.checked) {
      types.push('status');
      values.status = fields.statusSelect.value;
    }
    if (fields.notesCheck.checked) {
      var note = optionalString(fields.notes);
      if (!note) {
        fields.message.textContent = 'Nova bilješka ne može biti prazna.';
        fields.message.hidden = false;
        return;
      }
      types.push('notes');
      values.notes = note;
    }
    if (types.length === 0) {
      fields.message.textContent = 'Odaberi barem jedno polje za ispravak.';
      fields.message.hidden = false;
      return;
    }
    var correctionId = nextUniqueId('correction', current.store.corrections, 'correction_id');
    if (!correctionId) {
      fields.message.textContent = 'Greška pri generaciji identifikatora.';
      fields.message.hidden = false;
      return;
    }
    var correction = {
      correction_id: correctionId,
      original_record_id: fields.original.activity_id,
      original_record_type: 'activity',
      correction_types: types,
      corrected_values: values,
      created_at: new Date().toISOString()
    };
    var explanation = optionalString(fields.explanation);
    if (explanation) correction.explanation = explanation;

    var nextStore = activityStoreCandidate(current, current.store.activities, current.store.corrections.concat([correction]));
    var errors = window.v2ValidateForBackup(nextStore);
    if (errors.length > 0) {
      fields.message.textContent = 'Ispravak nije spremljen: ' + activityValidationMessage(errors[0]) + '.';
      fields.message.hidden = false;
      return;
    }
    try {
      localStorage.setItem('vocnjak_v2', JSON.stringify(nextStore));
    } catch (e) {
      fields.message.textContent = 'Pohranu nije moguće zapisati.';
      fields.message.hidden = false;
      return;
    }
    correctionForm.reset();
    pendingDiaryStatus = 'Ispravak spremljen.';
    location.hash = '#v2/diary';
  }

  function observationCorrectionValidationMessage(error) {
    if (error.indexOf('.corrected_values.observed_on in the future') !== -1 || error.indexOf('.observed_on in the future') !== -1) {
      return 'Datum ne može biti u budućnosti. Ispravak opisuje stvarni događaj koji se već dogodio.';
    }
    if (error.indexOf('.corrected_values.observed_on must be on or before original recorded_at local calendar date') !== -1 ||
        error.indexOf('.observed_on must be on or before recorded_at local calendar date') !== -1) {
      return 'Datum opažanja ne može biti nakon dana kada je izvorni zapis spremljen.';
    }
    if (error.indexOf('.corrected_values.plant_id') !== -1 || error.indexOf('.plant_id must reference') !== -1 ||
        error.indexOf('.payload.source_entry_id not valid for plant species') !== -1) {
      return 'Odabrana voćka nije kompatibilna s izvornim zapisom.';
    }
    if (error.indexOf('.corrected_values.text') !== -1 || error.indexOf('.payload.text') !== -1) {
      return 'Bilješka ne može biti prazna i može imati najviše 1000 znakova.';
    }
    if (error.indexOf('.corrected_values.count') !== -1 || error.indexOf('.payload.count') !== -1) {
      return 'Broj ulova mora biti cijeli broj 0 ili veći.';
    }
    if (error.indexOf('.corrected_values.stage_code') !== -1 || error.indexOf('.payload.stage_code') !== -1) {
      return 'Odabrana faza razvoja nije valjana.';
    }
    if (error.indexOf('.corrected_values.scouting_result') !== -1 || error.indexOf('.payload.finding') !== -1 ||
        error.indexOf('.payload.selected_sign_keys') !== -1) {
      return 'Nalaz pregleda nije valjan. Ako je primijećeno, odaberi barem jedan vidljivi znak.';
    }
    if (error.indexOf('.corrected_values.scouting_note') !== -1 || error.indexOf('.payload.note') !== -1) {
      return 'Bilješka pregleda mora biti ne-prazna, spremljena bez praznina na početku ili kraju, ili odaberi Bez bilješke.';
    }
    if (error.indexOf('observation_group_id') !== -1) {
      return 'Grupni ispravak nije spremljen jer grupa ne prolazi provjeru.';
    }
    if (error.indexOf('.correction_types') !== -1 || error.indexOf('.corrected_values keys') !== -1) {
      return 'Odabrani ispravak nije dostupan za ovaj zapis.';
    }
    return error + '.';
  }

  function currentObservationCorrectionEntries(fields, current) {
    var entries = effectiveObservationEntries(current.store);
    if (fields.recordType === 'observation_group') {
      var group = findEffectiveObservationGroup(entries, fields.groupId);
      if (!groupedObservationCorrectionAvailable(group)) return { ok: false, error: 'Ispravak nije dostupan za ovaj grupni zapis.' };
      return { ok: true, entries: group };
    }
    var entry = findEffectiveObservationEntry(entries, fields.observationId);
    if (!entry || hasOwnKey(entry.original, 'observation_group_id')) return { ok: false, error: 'Zapis nije pronađen.' };
    return { ok: true, entries: [entry] };
  }

  function buildObservationCorrectionValues(fields) {
    var types = [];
    var values = {};
    if (fields.dateCheck && fields.dateCheck.checked) {
      if (!fields.dateInput.value) return { ok: false, error: 'Novi datum je obavezan.' };
      types.push('date');
      values.observed_on = fields.dateInput.value;
    }
    if (fields.plantCheck && fields.plantCheck.checked) {
      if (!fields.plantSelect.value) return { ok: false, error: 'Odaberi novu voćku.' };
      types.push('plant');
      values.plant_id = fields.plantSelect.value;
    }
    if (fields.noteTextCheck && fields.noteTextCheck.checked) {
      var noteText = fields.noteText.value.trim();
      if (!noteText) return { ok: false, error: 'Bilješka ne može biti prazna.' };
      if (noteText.length > 1000) return { ok: false, error: 'Bilješka može imati najviše 1000 znakova.' };
      types.push('note_text');
      values.text = noteText;
    }
    if (fields.trapCountCheck && fields.trapCountCheck.checked) {
      if (!/^[0-9]+$/.test(fields.trapCountInput.value)) return { ok: false, error: 'Broj ulova mora biti cijeli broj 0 ili veći.' };
      types.push('trap_count');
      values.count = Number(fields.trapCountInput.value);
    }
    if (fields.stageCheck && fields.stageCheck.checked) {
      var stageEntry = typeof stageDiaryEntryByCode === 'function' ? stageDiaryEntryByCode(fields.stageSelect.value) : null;
      if (!stageEntry) return { ok: false, error: 'Odabrana faza razvoja nije valjana.' };
      types.push('stage_code');
      values.stage_code = fields.stageSelect.value;
    }
    if (fields.scoutingResultCheck && fields.scoutingResultCheck.checked) {
      var findingValue;
      if (fields.scoutingNoneRadio.checked) findingValue = false;
      else if (fields.scoutingPresentRadio.checked) findingValue = true;
      else return { ok: false, error: 'Odaberi nalaz pregleda.' };
      var signKeys = findingValue ? selectedCorrectionSignKeys(fields.scoutingSignInputs || []) : [];
      if (findingValue && signKeys.length === 0) return { ok: false, error: 'Ako je primijećeno, odaberi barem jedan vidljivi znak.' };
      types.push('scouting_result');
      values.scouting_result = {
        finding: { mode: 'presence', value: findingValue },
        selected_sign_keys: signKeys
      };
    }
    if (fields.scoutingNoteCheck && fields.scoutingNoteCheck.checked) {
      if (fields.scoutingNoteNoneRadio.checked) {
        values.scouting_note = null;
      } else if (fields.scoutingNoteTextRadio.checked) {
        var scoutingNote = fields.scoutingNoteText.value.trim();
        if (!scoutingNote) return { ok: false, error: 'Bilješka pregleda ne može biti prazna. Odaberi Bez bilješke ako zapis treba biti bez bilješke.' };
        if (scoutingNote.length > 1000) return { ok: false, error: 'Bilješka pregleda može imati najviše 1000 znakova.' };
        values.scouting_note = scoutingNote;
      } else {
        return { ok: false, error: 'Odaberi novu bilješku pregleda ili Bez bilješke.' };
      }
      types.push('scouting_note');
    }
    if (types.length === 0) return { ok: false, error: 'Odaberi barem jedno polje za ispravak.' };
    return { ok: true, types: types, values: values };
  }

  function saveCurrentObservationCorrection() {
    var fields = currentCorrectionFields;
    if (!fields) return;
    fields.message.hidden = true;
    var current = readValidStore();
    if (!current.ok) {
      fields.message.textContent = current.error;
      fields.message.hidden = false;
      return;
    }
    var target = currentObservationCorrectionEntries(fields, current);
    if (!target.ok) {
      fields.message.textContent = target.error;
      fields.message.hidden = false;
      return;
    }
    var built = buildObservationCorrectionValues(fields);
    if (!built.ok) {
      fields.message.textContent = built.error;
      fields.message.hidden = false;
      return;
    }
    var createdAt = new Date().toISOString();
    var explanation = optionalString(fields.explanation);
    var corrections = [];
    for (var i = 0; i < target.entries.length; i++) {
      var correctionId = nextUniqueId('correction', current.store.corrections.concat(corrections), 'correction_id');
      if (!correctionId) {
        fields.message.textContent = 'Greška pri generaciji identifikatora.';
        fields.message.hidden = false;
        return;
      }
      var correction = {
        correction_id: correctionId,
        original_record_id: target.entries[i].original.observation_id,
        original_record_type: 'observation',
        correction_types: built.types.slice(),
        corrected_values: cloneCorrectionValues(built.values),
        created_at: createdAt
      };
      if (explanation) correction.explanation = explanation;
      corrections.push(correction);
    }
    var nextStore = correctionStoreCandidate(current, current.store.corrections.concat(corrections));
    var errors = window.v2ValidateForBackup(nextStore);
    if (errors.length > 0) {
      fields.message.textContent = 'Ispravak nije spremljen: ' + observationCorrectionValidationMessage(errors[0]);
      fields.message.hidden = false;
      return;
    }
    try {
      localStorage.setItem('vocnjak_v2', JSON.stringify(nextStore));
    } catch (e) {
      fields.message.textContent = 'Pohranu nije moguće zapisati.';
      fields.message.hidden = false;
      return;
    }
    correctionForm.reset();
    pendingDiaryStatus = 'Ispravak spremljen.';
    location.hash = '#v2/diary';
  }

  function saveCurrentCorrection() {
    var fields = currentCorrectionFields;
    if (!fields) return;
    if (fields.recordType === 'observation' || fields.recordType === 'observation_group') saveCurrentObservationCorrection();
    else saveCurrentActivityCorrection();
  }

  function backTargetForRoute(route) {

    }
    if (bottomNavTabs && bottomNavTabs.length) {
      var activeTab = ACTIVE_TAB_BY_ROUTE[route.name] || null;
      for (var i = 0; i < bottomNavTabs.length; i++) {
        var tab = bottomNavTabs[i];
        if (activeTab && tab.dataset.tab === activeTab) tab.classList.add('active');
        else tab.classList.remove('active');

    }
    var cls = ROUTE_CLASS[route.name] || 'primary';
    if (topBarBackBtn) {
      if (cls === 'detail' || cls === 'form') {
        var target = backTargetForRoute(route);
        if (target) {
          topBarBackBtn.hidden = false;
          topBarBackBtn.dataset.backTarget = target;
          if (topBarBackLabel) topBarBackLabel.textContent = backLabelForRoute(route);
        } else {
          topBarBackBtn.hidden = true;
          delete topBarBackBtn.dataset.backTarget;
        }
      } else {
        topBarBackBtn.hidden = true;
        delete topBarBackBtn.dataset.backTarget;
      }

    if (cls === 'form') root.classList.add('v2-route-form');
    else root.classList.remove('v2-route-form');
    if (cls === 'detail' || cls === 'form') root.classList.add('v2-route-back');
    else root.classList.remove('v2-route-back');
  }

  if (topBarBackBtn) {
    topBarBackBtn.addEventListener('click', function () {
      var target = topBarBackBtn.dataset.backTarget;
      if (target) location.hash = target;
    });
  }

  function render() {
    var route = getRoute();
    updateShellChrome(route);
    if (route.name === 'pregled') renderPregled();
    else if (route.name === 'kalendar') renderKalendar();
    else if (route.name === 'seasonal_action') renderSeasonalActionDetail(route);
    else if (route.name === 'add') renderAdd();
    else if (route.name === 'activity_add') renderActivityAdd(route);
    else if (route.name === 'diary' || route.name === 'plant_diary') renderDiary(route);
    else if (route.name === 'correction') renderCorrection(route);
    else if (route.name === 'detail') renderDetail(route);
    else renderList();
  }

  window.addEventListener('hashchange', render);
  render();
})();
