<style>
  :root {
    --green-deep: #1a3320;
    --green-mid: #2d5a2d;
    --green-light: #4a8a4a;
    --green-pale: #e8f0e8;
    --cream: #f5f2eb;
    --cream-dark: #ede9df;
    --amber: #d97706;
    --amber-pale: #fef3c7;
    --red: #b91c1c;
    --red-pale: #fee2e2;
    --indigo: #4338ca;
    --indigo-pale: #e0e7ff;
    --text: #1c1a14;
    --text-mid: #4a4535;
    --text-light: #8a8070;
    --border: #ddd8cc;
    --white: #ffffff;
    --shadow: 0 2px 12px rgba(26,51,32,0.10);
    --shadow-lg: 0 8px 32px rgba(26,51,32,0.18);
    --r: 12px;
    --r-sm: 7px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; min-height: -webkit-fill-available; overflow-x: hidden; user-select: none; -webkit-user-select: none; }

  .header { background: var(--green-deep); padding: calc(var(--safe-top) + 14px) 20px 14px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 16px rgba(0,0,0,0.25); }
  .header-title { font-family: 'Playfair Display', serif; color: #fff; font-size: 20px; }
  .header-sub { font-size: 10px; color: #7aad7a; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 2px; }
  .today-badge { background: rgba(255,255,255,0.12); color: #c8e6c8; font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 500; }

  .nav-tabs { display: flex; background: var(--green-mid); padding: 0 6px; gap: 2px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .tab-btn { background: transparent; border: none; color: #c8e6c8; padding: 9px 14px 7px; font-size: 11px; font-family: 'DM Sans', sans-serif; font-weight: 500; cursor: pointer; border-radius: 6px 6px 0 0; white-space: nowrap; display: flex; align-items: center; gap: 5px; transition: background 0.15s, color 0.15s; flex-shrink: 0; }
  .tab-btn.active { background: var(--cream); color: var(--green-deep); font-weight: 700; }
  .tab-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--white); border-top: 1px solid var(--border); display: flex; padding-bottom: var(--safe-bottom); z-index: 100; box-shadow: 0 -2px 16px rgba(0,0,0,0.08); }
  .bnav-btn { flex: 1; background: none; border: none; padding: 10px 4px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-light); font-size: 10px; font-family: 'DM Sans', sans-serif; font-weight: 500; transition: color 0.15s; }
  .bnav-btn.active { color: var(--green-mid); }
  .bnav-btn svg { width: 22px; height: 22px; }

  .main { padding: 16px 16px calc(72px + var(--safe-bottom)) 16px; max-width: 520px; margin: 0 auto; }

  .section-label { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text-light); font-weight: 500; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .section-label::after { content:''; flex:1; height:1px; background: var(--border); }

  .card { background: var(--white); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 10px; overflow: hidden; box-shadow: var(--shadow); }

  /* ── STAT CARDS — clickable ── */
  .overview-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); text-align: center; cursor: pointer; transition: transform 0.1s, box-shadow 0.1s; }
  .stat-card:active { transform: scale(0.97); box-shadow: none; }
  .stat-card.clickable:hover { border-color: var(--green-mid); }
  .stat-num { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--green-mid); line-height: 1; }
  .stat-num.red { color: var(--red); }
  .stat-label { font-size: 11px; color: var(--text-light); margin-top: 4px; font-weight: 500; }
  .stat-arrow { font-size: 10px; color: var(--green-light); margin-top: 2px; }

  /* ── ALERT BANNER ── */
  .alert-banner { background: linear-gradient(135deg, #1a3320 0%, #2d5a2d 100%); color: #fff; padding: 14px 16px; border-radius: var(--r); margin-bottom: 14px; box-shadow: var(--shadow-lg); position: relative; }
  .alert-title { font-family: 'Playfair Display', serif; font-size: 15px; margin-bottom: 4px; padding-right: 28px; }
  .alert-body { font-size: 12px; color: #c8e6c8; line-height: 1.5; padding-right: 28px; }
  .alert-action { margin-top: 10px; display: flex; gap: 8px; }
  .alert-btn { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.25); border-radius: 6px; padding: 6px 14px; font-size: 12px; font-family: 'DM Sans', sans-serif; cursor: pointer; font-weight: 500; }
  .alert-btn:active { background: rgba(255,255,255,0.25); }
  .alert-dismiss { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.12); border: none; color: #fff; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }

  /* ── PLANT CARD ── */
  .plant-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 10px; overflow: hidden; box-shadow: var(--shadow); display: flex; align-items: stretch; cursor: pointer; transition: box-shadow 0.15s, transform 0.1s; }
  .plant-card:active { transform: scale(0.98); box-shadow: none; }
  .plant-card-accent { width: 5px; flex-shrink: 0; }
  .plant-card-body { padding: 12px 14px; flex: 1; }
  .plant-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .plant-card-name { font-family: 'Playfair Display', serif; font-size: 16px; color: var(--text); }
  .plant-card-sub { font-size: 11px; color: var(--text-light); margin-bottom: 6px; }
  .plant-card-todos { font-size: 12px; color: var(--text-mid); }

  .status-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 20px; font-family: 'DM Sans', sans-serif; letter-spacing: 0.3px; }
  .status-dot { width: 5px; height: 5px; border-radius: 50%; }
  .s-dobro { background: #d1fae5; color: #065f46; } .s-dobro .status-dot { background: #10b981; }
  .s-prati { background: var(--amber-pale); color: #92400e; } .s-prati .status-dot { background: var(--amber); }
  .s-hitno { background: var(--red-pale); color: var(--red); } .s-hitno .status-dot { background: var(--red); }
  .s-odradjeno { background: var(--indigo-pale); color: var(--indigo); } .s-odradjeno .status-dot { background: var(--indigo); }

  /* ── TODO / ENTRY ── */
  .todo-item { background: #fffbf0; border: 1px solid #fde68a; border-radius: var(--r-sm); padding: 9px 12px; display: flex; align-items: flex-start; gap: 8px; margin-bottom: 7px; }
  .todo-text { flex: 1; font-size: 13px; color: #78350f; line-height: 1.45; }
  .todo-meta { font-size: 10px; color: var(--text-light); margin-top: 2px; }
  .btn-icon { background: none; border: none; width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; flex-shrink: 0; transition: background 0.12s; }
  .btn-done { color: #059669; } .btn-done:active { background: #d1fae5; }
  .btn-del { color: #dc2626; } .btn-del:active { background: #fee2e2; }

  .entry-item { background: var(--white); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px 12px; display: flex; gap: 10px; margin-bottom: 8px; align-items: flex-start; }
  .entry-stripe { width: 3px; border-radius: 4px; align-self: stretch; flex-shrink: 0; }
  .entry-date { font-size: 11px; color: var(--text-light); margin-bottom: 4px; }
  .entry-tags { display: flex; gap: 5px; margin-bottom: 5px; flex-wrap: wrap; }
  .tag { font-size: 10px; padding: 1px 7px; border-radius: 10px; background: var(--cream-dark); color: var(--text-mid); font-weight: 500; }
  .entry-note { font-size: 13px; color: var(--text); line-height: 1.5; }
  .btn-del-sm { background: none; border: none; color: #ccc; cursor: pointer; font-size: 15px; padding: 2px; flex-shrink: 0; }
  .btn-del-sm:active { color: var(--red); }

  /* ── CALENDAR ── */
  .cal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 12px; }
  .cal-month { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--text); }
  .cal-nav-btn { background: var(--cream-dark); border: none; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; color: var(--text); }
  .cal-grid-header { display: grid; grid-template-columns: repeat(7, 1fr); padding: 0 8px; margin-bottom: 4px; }
  .cal-day-name { text-align: center; font-size: 10px; font-weight: 600; color: var(--text-light); letter-spacing: 1px; text-transform: uppercase; padding: 4px 0; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); padding: 0 8px 16px; gap: 2px; }
  .cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; position: relative; transition: background 0.12s; gap: 2px; }
  .cal-day:active { background: var(--cream-dark); }
  .cal-day.empty { cursor: default; }
  .cal-day.today .cal-day-num { background: var(--green-mid); color: #fff; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .cal-day.has-task::after { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--amber); position: absolute; bottom: 3px; }
  .cal-day.has-urgent::after { background: var(--red); }
  .cal-day.has-done::after { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--green-light); position: absolute; bottom: 3px; }
  .cal-day.has-skipped::after { content: ''; width: 5px; height: 5px; border-radius: 50%; background: #9ca3af; position: absolute; bottom: 3px; }
  .cal-day.has-missed::after { content: ''; width: 5px; height: 5px; border-radius: 50%; background: #9ca3af; position: absolute; bottom: 3px; }
  .cal-day-num { font-size: 13px; font-weight: 500; color: var(--text); line-height: 26px; }
  .cal-task-item { margin: 0 0 8px; background: var(--cream); border-radius: var(--r-sm); padding: 10px 12px; border-left: 3px solid var(--green-mid); }
  .cal-task-item.urgent { border-left-color: var(--red); background: var(--red-pale); }
  .cal-task-plant { font-size: 10px; color: var(--text-light); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px; }
  .cal-task-text { font-size: 13px; color: var(--text); line-height: 1.4; }

  /* ── FORMS ── */
  .form-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .form-row-3 { grid-template-columns: 1fr 1fr 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-light); font-weight: 600; }
  .form-input, .form-select, .form-textarea { border: 1.5px solid var(--border); border-radius: var(--r-sm); padding: 9px 11px; font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--text); background: var(--cream); outline: none; transition: border-color 0.15s; -webkit-appearance: none; width: 100%; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--green-mid); background: var(--white); }
  .form-textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
  .form-btns { display: flex; gap: 8px; margin-top: 12px; }
  .btn-primary { background: var(--green-mid); color: #fff; border: none; border-radius: var(--r-sm); padding: 10px 20px; font-size: 14px; font-family: 'DM Sans', sans-serif; font-weight: 600; cursor: pointer; flex: 1; }
  .btn-primary:active { background: var(--green-deep); }
  .btn-secondary { background: var(--cream-dark); color: var(--text-mid); border: none; border-radius: var(--r-sm); padding: 10px 16px; font-size: 14px; font-family: 'DM Sans', sans-serif; cursor: pointer; }

  /* ── DETAIL VIEW ── */
  .detail-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .back-btn { background: var(--cream-dark); border: none; border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer; color: var(--text-mid); font-family: 'DM Sans', sans-serif; }

  .empty { text-align: center; color: var(--text-light); font-size: 13px; font-style: italic; padding: 20px 0; }

  .toast { position: fixed; bottom: calc(72px + var(--safe-bottom) + 16px); left: 50%; transform: translateX(-50%) translateY(20px); background: var(--green-deep); color: #fff; padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 500; opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; white-space: nowrap; z-index: 200; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { width: 0; }

  /* ── WEATHER WIDGET ── */
  .weather-card { background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%); border: 1px solid #bae6fd; border-radius: var(--r); padding: 14px 16px; margin-bottom: 14px; }
  .weather-row { display: flex; justify-content: space-between; align-items: center; }
  .weather-day { text-align: center; flex: 1; }
  .weather-day-label { font-size: 10px; font-weight: 600; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .weather-temp { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--text); }
  .weather-rain { font-size: 11px; color: #0369a1; margin-top: 2px; }
  .weather-divider { width: 1px; height: 40px; background: #bae6fd; margin: 0 8px; flex-shrink: 0; }
  .weather-warn { background: #fef3c7; border: 1px solid #fde68a; border-radius: var(--r-sm); padding: 8px 12px; margin-top: 10px; font-size: 12px; color: #92400e; line-height: 1.4; }
  /* BEGIN V2 SHELL — Slice 0 */
  .v2-active {
    /* Phase B V2 token system - Adriatic / sea. Declared only; consumed in later UXR sessions. */
    --v2-bg: #e3e8e9;
    --v2-cream: #f5f7f8;
    --v2-cream-2: #e8edef;

    --v2-acc-sour_cherry: #a64046;
    --v2-acc-plum: #7a4e6b;
    --v2-acc-peach: #d9905c;
    --v2-acc-nectarine: #d9784e;

  }

  .v2-active #plantTabs,
  .v2-active #mainContent,
  .v2-active .bottom-nav,

  .v2-active .v2-bottomnav-tab {

    { key: "e8", title: "Gašenje navodnjavanja", activityType: "observation", monthStart: 9, dayStart: 1, monthEnd: 9, dayEnd: 15, skipYear: 0, notes: "Završetak sezonskog navodnjavanja pred kasne berbe.\nJabuka i kasne sorte: ugasiti 2–3 tjedna prije berbe za bolji okus i čvrstoću ploda.\nAko je cijeli vrt na jednom ventilu: gasiti oko 1. rujna —\ntrešnja, nektarina, breskva i šljiva su tada već pobrane.\nTumačiti kao orchard management podsjetnik, ne kao obaveznu radnju u svakom scenariju." },
    { key: "e9", title: "Pregled za zimu", activityType: "observation", monthStart: 10, dayStart: 1, monthEnd: 10, dayEnd: 31, skipYear: 0, notes: "Jesenski pregled stabala pred zimu:\nstanje debla i rana, vezice (ne smiju rezati koru), zaštita od glodavaca,\npotpore mladih stabala, mumificirani plodovi na stablu i tlu.\nUkloniti sve izvore zaraze.\nPosebno važno za mlada stabla i stabla koja su imala stres u sezoni." }
  ],
  apple: [
    { key: "e1", title: "Post-bloom zaštita – krastavost i pepelnica", activityType: "spraying", monthStart: 4, dayStart: 10, monthEnd: 5, dayEnd: 10, skipYear: 0, notes: "Ključna zaštita protiv krastavosti jabuke (Venturia inaequalis) i pepelnice.\nPrimijeniti nakon cvatnje kada se formiraju mladi listovi i plodovi.\nNE tretirati za cvatnje — pčele moraju biti zaštićene.\nScore 250 EC + Mospilan 20 SP mogu se miješati u jednom prolazu.\nTretmane ponavljati prema infekcijskom pritisku i kiši.\nZa mlada stabla god. 1–2 bez ploda: manje kritično, ali nije na odmet." },
    { key: "e2", title: "Praćenje jabučnog savijača (feromonske klopke)", activityType: "monitoring", monthStart: 4, dayStart: 25, monthEnd: 8, dayEnd: 15, skipYear: 0, notes: "Jabučni savijač (Cydia pomonella) — crvi u plodovima jabuke.\nPostaviti feromonsku klopku na 1.5–2 m visine, u sjenu krošnje.\nTjedno pregledavati ulov.\nTretman insekticidom (Mospilan) samo ako ulov prijeđe prag štetnosti —\nnagli porast = tretman unutar 7–10 dana.\nZa mlada stabla god. 1–2 bez ploda: nije prioritet." },
    { key: "e3", title: "Prorjeđivanje plodova", activityType: "observation", monthStart: 5, dayStart: 15, monthEnd: 6, dayEnd: 15, skipYear: 0, notes: "Uklanjanje viška plodova radi bolje veličine i kvalitete uroda.\nOstaviti 1 plod na 10–15 cm grane. Ukloniti blizance i oštećene plodove.\nJabuka je sklona alternativnoj rodnosti — redovito prorjeđivanje smanjuje taj problem.\nZa mlada stabla god. 1–2 bez značajnog uroda: nije potrebno." },
    { key: "e4", title: "Mreža protiv ptica – jabuka", activityType: "observation", monthStart: 8, dayStart: 15, monthEnd: 10, dayEnd: 1, skipYear: 0, notes: "Jabuka Fuji i kasne sorte rijetko su intenzivno napadnute pticama dok su plodovi čvrsti.\nPostaviti mrežu samo ako postoji vidljiv pritisak ptica.\nZa rane i srednje sorte: pratiti i reagirati prema situaciji.\nZa mlada stabla god. 1–2 bez uroda: nije potrebno." },
    { key: "e5", title: "Berba jabuke", activityType: "harvest", monthStart: 8, dayStart: 20, monthEnd: 10, dayEnd: 20, skipYear: 0, notes: "Termin berbe ovisi o sorti ili fallback grupi — vidi PLANT_CATALOG_V1.md za harvestWindow.\nPrimjeri: Gala (aug 20 – sep 10), Fuji / Idared (sep 25 – oct 15).\nBrati zakretanjem ploda — ne čupati, ne vući.\nTest zrelosti: plod lako otpada pri laganom zakretanju, sjemenke smeđe.\nFuji: čekati punu zrelost — prerano ubrana Fuji jabuka nema okusa.\nBrati po suhom, izbjegavati jutarnju rosu.\nNe ostavljati oštećene plodove — uzrokuju moniliju." }
  ],
  pear: [
    { key: "e1", title: "Bakar – preventivna zaštita od vatrostuh", activityType: "spraying", monthStart: 3, dayStart: 15, monthEnd: 4, dayEnd: 10, skipYear: 0, notes: "Kruška je jedina standardna voćka s ozbiljnim rizikom vatrostuh (Erwinia amylovora).\nPrimijeniti bakar preventivno oko cvatnje.\nCvatnja kruške je ranije od jabuke — pratiti stanje pupova i prilagoditi termin.\nNE prskati direktno na otvorene cvjetove — oštećuje cvjetove i pčele.\nCuprablau Z 35 WG ili ekvivalent.\nRazmak od bijelog ulja: min. 7–10 dana.\nAko se pojave simptomi vatrostuh (tamnosmeđe uvenule grane): odmah rezati ispod vidljive zaraze,\ndezinficirati alat između rezova, spaliti rezani material." },
    { key: "e2", title: "Praćenje kruškine buhe i savijača", activityType: "monitoring", monthStart: 4, dayStart: 20, monthEnd: 8, dayEnd: 15, skipYear: 0, notes: "Kruškina buha (Cacopsylla pyri): štitaste uši na naličju listova, medna rosa, čađavica.\nVizualni pregled mladih izbojaka i listova tjedno.\nTretman (bijelo ulje ili Mospilan) samo pri vidljivom problemu.\nKruškini savijač (Grapholita molesta): feromonska klopka ako je dostupna.\nZa mlada stabla: fokus na lisne uši i buhu." },
    { key: "e3", title: "Post-bloom zaštita – krastavost kruške", activityType: "spraying", monthStart: 4, dayStart: 15, monthEnd: 5, dayEnd: 15, skipYear: 0, notes: "Zaštita od krastavosti kruške (Venturia pirina) i monililje.\nPrimijeniti nakon cvatnje. Score 250 EC + Mospilan 20 SP.\nNE tretirati za cvatnje.\nZa mlada stabla god. 1–2: manje kritično, ali korisno u vlažnim sezonama." },
    { key: "e4", title: "Prorjeđivanje plodova – kruška", activityType: "observation", monthStart: 5, dayStart: 20, monthEnd: 6, dayEnd: 15, skipYear: 0, notes: "Kruška ne zahtijeva agresivno prorjeđivanje kao jabuka.\nOstaviti 1–2 ploda po grozdu, razmak oko 10 cm.\nUkloniti oštećene i deformirane plodove.\nZa mlada stabla god. 1–2: nije potrebno." },
    { key: "e5", title: "Mreža protiv ptica – kruška", activityType: "observation", monthStart: 7, dayStart: 20, monthEnd: 9, dayEnd: 15, skipYear: 0, notes: "Kruška može biti napadnuta pticama pred samu berbu.\nPratiti vizualno — mreža po potrebi kada plodovi počnu sazrijevati.\nZa mlada stabla bez uroda: nije potrebno." },
    { key: "e6", title: "Berba kruške", activityType: "harvest", monthStart: 8, dayStart: 1, monthEnd: 10, dayEnd: 5, skipYear: 0, notes: "Termin berbe ovisi o sorti ili fallback grupi — vidi PLANT_CATALOG_V1.md za harvestWindow.\nKRITIČNO: brati PRIJE potpune konzumne zrelosti — kruška dozrijeva nakon berbe, ne na stablu.\nTest na stablu: plod se lako odvaja zakretanjem, ali još čvrst.\nDozrijevanje nakon berbe: sobna temperatura 3–7 dana.\nNE čekati da omekša na stablu — bit će brašnasta i neukusna.\nBrati pažljivo — lako dobiva modrice." }
  ],
  cherry: [
    { key: "e1", title: "Praćenje trešnjine muhe – žute ljepljive ploče", activityType: "monitoring", monthStart: 4, dayStart: 25, monthEnd: 6, dayEnd: 20, skipYear: 0, notes: "Trešnjina muha (Rhagoletis cerasi) — najvažniji štetnik trešnje u EU.\nPostaviti 2–3 žute ljepljive ploče po stablu na visinu 1.5–2 m, u sjenu krošnje.\nTjedno pregledavati:\n— 0–2 muhe/tjedan → nema tretmana\n— nagli porast → insekticid (Mospilan) unutar 7–10 dana od prvog masovnog leta.\nMospilan karenca: min. 14 dana do berbe — ne tretirati ako je berba za 10 dana ili manje.\nZa mlada stabla god. 1–2 bez ploda: nije prioritet." },
    { key: "e2", title: "Prorjeđivanje trešnje (po potrebi)", activityType: "observation", monthStart: 5, dayStart: 15, monthEnd: 6, dayEnd: 1, skipYear: 0, notes: "Trešnja nije obavezna za prorjeđivanje — stablo samo regulira broj plodova.\nGisela 5 ne prerodi ekscesivno.\nPo želji: ukloniti blizance (dva srasla ploda) i sitne zaostale plodove.\nOstaviti ~5–8 cm razmaka između plodova u grozdu.\nZnakovi previše: grane vise jako pod težinom, svi plodovi sitni i blijedi.\nOvo smanjuje broj plodova koji padaju na tlo i štedi leđa pri čišćenju.\nZa mlada stabla god. 1–2: nije potrebno." },
    { key: "e3", title: "Mreža protiv ptica – trešnja", activityType: "observation", monthStart: 6, dayStart: 1, monthEnd: 6, dayEnd: 30, skipYear: 0, notes: "Postaviti 2–3 tjedna prije berbe.\nZa Kordiju (berba 20.6.–5.7.): postaviti oko 1.–15.6.\nZa ranije sorte (Burlat, berba od 1.6.): postaviti već kraj svibnja.\nVeličina: min. 4×4 m, preporučeno 5×5 m.\nTip: s bočnim zipperom za pristup pri berbi bez skidanja mreže.\nMreža štiti i od kiše → smanjuje pucanje plodova pred berbu.\nSkinuti odmah nakon berbe.\nZa mlada stabla god. 1–2 bez uroda: nije potrebno." },
    { key: "e4", title: "Berba trešnje", activityType: "harvest", monthStart: 6, dayStart: 1, monthEnd: 7, dayEnd: 25, skipYear: 0, notes: "Termin ovisi o sorti ili fallback grupi — vidi PLANT_CATALOG_V1.md za harvestWindow.\nBrati sa peteljkom — plod bez peteljke traje znatno kraće (max 1–2 dana).\nBrati po suhom vremenu, u hladnijem dijelu dana (jutro, večer).\nTest zrelosti: puna tamnocrvena boja, čvrstoća uz blag pritisak popušta.\nNe brati mokre plodove — pucaju i brzo trunu.\nČuvanje: 3–5 dana na 0–4°C.\nNe ostavljati prezrele plodove na stablu — privlače ose, uzrokuju gnilobu." }
  ],
  nectarine: [
    { key: "e1", title: "Bakar – kovrčavost lista (KRITIČNO – nektarina)", activityType: "spraying", monthStart: 2, dayStart: 10, monthEnd: 3, dayEnd: 5, skipYear: 0, notes: "KRITIČNO ZA NEKTARINU — ne smije se propustiti.\nPrimijeniti dok su pupovi nektarine još zatvoreni ili tek počinju bubriti.\nTaphrina deformans: nema lijeka nakon zaraze — jedino preventiva.\nCuprablau Z 35 WG ili ekvivalent.\nAko je proljeće vlažno: 2 tretmana u razmaku 7–10 dana.\nOvo prskanje je DODATAK zimskom bakru iz shared bloka — primijeniti specifično za nektarinu.\nRazmak od bijelog ulja: min. 7–10 dana.\nZa mlada stabla: primijeniti — posebno važno u prvim godinama." },
    { key: "e2", title: "Praćenje lisnih ušiju i breskvinog savijača", activityType: "monitoring", monthStart: 4, dayStart: 15, monthEnd: 7, dayEnd: 31, skipYear: 0, notes: "Tjedno pregledavati naličje listova i mlade izbojke.\nLisne uši na nektarini mogu biti problem — Mospilan pri vidljivoj koloniji.\nBreskvin savijač (Grapholita molesta): feromonska klopka ako je dostupna.\nTretman samo pri vidljivom problemu ili prijeđenom pragu.\nZa mlada stabla: fokus na lisne uši." },
    { key: "e3", title: "Post-bloom zaštita – monilija i štetnici", activityType: "spraying", monthStart: 5, dayStart: 5, monthEnd: 5, dayEnd: 25, skipYear: 0, notes: "Primijeniti nakon završetka cvatnje.\nScore 250 EC + Mospilan 20 SP — u jednom prolazu.\nZaštita od monililje (Monilinia laxa) i breskvinog savijača.\nMospilan NIKAD za cvatnje — toksičan za pčele.\nZa mlada stabla god. 1–2: nije obavezno, ali preporučeno u vlažnim sezonama." },
    { key: "e4", title: "Prorjeđivanje plodova – nektarina", activityType: "observation", monthStart: 5, dayStart: 20, monthEnd: 6, dayEnd: 10, skipYear: 0, notes: "PREPORUČENO za nektarinu — jako prorodi bez prorjeđivanja.\nOstaviti 1 plod na 10–15 cm grane.\nUkloniti blizance, sitne i oštećene plodove.\nBez prorjeđivanja: sitni plodovi, lom grana od težine, iscrpljenost stabla.\nZa mlada stabla god. 1–2 bez uroda: nije potrebno." },
    { key: "e5", title: "Mreža protiv ptica – nektarina", activityType: "observation", monthStart: 7, dayStart: 20, monthEnd: 8, dayEnd: 5, skipYear: 0, notes: "Postaviti kada plodovi počnu mijenjati boju (žuto-narančasta osnova vidljiva).\nKos i drozd napadaju nektarinu agresivno pred berbu.\nVeličina mreže: min. 4×4 m. Tip s bočnim zipperom preporučen.\nSkinuti odmah nakon berbe.\nZa mlada stabla god. 1–2 bez uroda: nije potrebno." },
    { key: "e6", title: "Berba nektarine", activityType: "harvest", monthStart: 7, dayStart: 1, monthEnd: 9, dayEnd: 5, skipYear: 0, notes: "Termin ovisi o sorti ili fallback grupi — vidi PLANT_CATALOG_V1.md za harvestWindow.\nVIŠE PROLAZA — plodovi ne dozrijevaju istovremeno (3–4 prolaza u ~3 tjedna).\nTest zrelosti: blago popuštanje pri pritisku oko peteljke, osnovna boja žuto-narančasta.\nNE brati prerano — nektarina ne dozrijeva nakon berbe kao kruška.\nBrati pažljivo — tanka kožica lako se oštećuje.\nČuvati na 0–4°C do 2 tjedna." }
  ],
  peach: [
    { key: "e1", title: "Bakar – kovrčavost lista (KRITIČNO – breskva)", activityType: "spraying", monthStart: 2, dayStart: 10, monthEnd: 3, dayEnd: 5, skipYear: 0, notes: "KRITIČNO ZA BRESKVU — identično kao kod nektarine, ne smije se propustiti.\nPrimijeniti dok su pupovi zatvoreni ili tek počinju bubriti.\nTaphrina deformans — jednom zaražena grana, nema lijeka.\nCuprablau Z 35 WG ili ekvivalent.\nVlažno proljeće: 2 tretmana u razmaku 7–10 dana.\nOvo prskanje je DODATAK zimskom bakru iz shared bloka.\nRazmak od bijelog ulja: min. 7–10 dana." },
    { key: "e2", title: "Praćenje lisnih ušiju i breskvinog savijača", activityType: "monitoring", monthStart: 4, dayStart: 15, monthEnd: 7, dayEnd: 31, skipYear: 0, notes: "Tjedno pregledavati naličje listova i vršne izbojke.\nLisne uši: Mospilan pri vidljivoj koloniji.\nBreskvin savijač (Grapholita molesta): feromonska klopka ako je dostupna.\nTretman samo pri vidljivom problemu." },
    { key: "e3", title: "Post-bloom zaštita – monilija i štetnici", activityType: "spraying", monthStart: 5, dayStart: 5, monthEnd: 5, dayEnd: 25, skipYear: 0, notes: "Nakon cvatnje. Score 250 EC + Mospilan 20 SP — u jednom prolazu.\nZaštita od monililje (Monilinia laxa) i breskvinog savijača.\nMospilan NIKAD za cvatnje.\nZa mlada stabla god. 1–2: nije obavezno, korisno u vlažnim sezonama." },
    { key: "e4", title: "Prorjeđivanje plodova – breskva", activityType: "observation", monthStart: 5, dayStart: 20, monthEnd: 6, dayEnd: 10, skipYear: 0, notes: "PREPORUČENO — breskva jako prorodi bez prorjeđivanja.\nOstaviti 1 plod na 10–15 cm grane.\nUkloniti blizance i oštećene plodove.\nBez prorjeđivanja: sitni plodovi, lom grana, alternativna rodnost.\nZa mlada stabla god. 1–2 bez uroda: nije potrebno." },
    { key: "e5", title: "Mreža protiv ptica – breskva", activityType: "observation", monthStart: 7, dayStart: 10, monthEnd: 7, dayEnd: 25, skipYear: 0, notes: "Postaviti kada plodovi počnu mijenjati boju (ružičasto-crvena osnova).\nKos i drozd napadaju breskvu pred berbu.\nVeličina: min. 4×4 m. Skinuti odmah nakon berbe.\nZa mlada stabla god. 1–2 bez uroda: nije potrebno." },
    { key: "e6", title: "Berba breskve", activityType: "harvest", monthStart: 6, dayStart: 25, monthEnd: 8, dayEnd: 31, skipYear: 0, notes: "Termin ovisi o sorti ili fallback grupi — vidi PLANT_CATALOG_V1.md za harvestWindow.\nViše prolaza — plodovi ne dozrijevaju istovremeno.\nTest zrelosti: blago popuštanje pri pritisku, osnovna boja žuto-narančasta.\nBrati pažljivo — dlakava kožica nježnija nego što izgleda.\nNa sobnoj temperaturi dozrijeva 2–3 dana nakon berbe.\nNe ostavljati prezrele plodove — privlače ose, uzrokuju moniliju." }

  apricot: [
    { key: "e1", title: "Bakar – zaštita PRIJE cvatnje (KRITIČNO – marelica)", activityType: "spraying", monthStart: 1, dayStart: 20, monthEnd: 2, dayEnd: 15, skipYear: 0, notes: "KRITIČNO: marelica cvate u veljači/ožujku — bakar mora biti primijenjen PRIJE.\nPrskati dok su pupovi još zatvoreni ili tek počinju bubriti.\nZaštita od: šarke (Plum pox virus, vektori su lisne uši), monililje, pjegavosti kore.\nCuprablau Z 35 WG ili ekvivalent.\nAko se propusti ovaj termin, ne može se naknadno kompenzirati.\nRazmak od bijelog ulja: min. 7–10 dana.\nOvo je DODATAK zimskom bakru iz shared bloka — primijeniti ranije, prilagođeno marelici." },
    { key: "e2", title: "Praćenje mraza za cvatnje marelice", activityType: "monitoring", monthStart: 2, dayStart: 1, monthEnd: 3, dayEnd: 31, skipYear: 0, notes: "Marelica cvate u veljači/ožujku — mraz je najveći neprijatelj.\nPratiti vremensku prognozu svakodnevno za cvatnje.\nKritična temperatura: ispod -1°C za otvorene cvjetove → oštećenje.\nMoguće mjere zaštite za manja stabla: agrotekstil (navlaka), dimni lonci.\nOvo je informacijska radnja — korisnik mora reagirati prema lokalnim uvjetima.\nLoš rod marelice je najčešće uzrokovan mrazom, ne bolešću ni štetnicima." },
    { key: "e3", title: "Praćenje lisnih ušiju i šarke (marelica)", activityType: "monitoring", monthStart: 4, dayStart: 1, monthEnd: 5, dayEnd: 15, skipYear: 0, notes: "Šarka (Plum pox virus) se prenosi lisnim ušima — pratiti kolonije na naličju listova.\nVizualni pregled: žuti prstenovi/mrlje na listovima = mogući simptom šarke.\nŠarka nema lijeka — zaražena stabla moraju se ukloniti.\nMospilan pri vidljivoj koloniji lisnih uši (preventivna kontrola vektora šarke).\nZa mlada stabla: posebno pratiti." },
    { key: "e4", title: "Post-bloom zaštita – monilija (marelica)", activityType: "spraying", monthStart: 4, dayStart: 15, monthEnd: 5, dayEnd: 15, skipYear: 0, notes: "Nakon cvatnje (marelica cvate ranije — prilagoditi termin prema stanju stabla).\nScore 250 EC za zaštitu od monililje (Monilinia laxa).\nMospilan dodati samo pri vidljivim štetnicima.\nNIKAD prskati otvorene cvjetove.\nZa mlada stabla god. 1–2: nije obavezno." },
    { key: "e5", title: "Prorjeđivanje plodova – marelica", activityType: "observation", monthStart: 5, dayStart: 1, monthEnd: 5, dayEnd: 25, skipYear: 0, notes: "Marelica jako prorodi (ako nije bilo mraza koji je uništio cvjetove).\nOstaviti 1 plod na 8–10 cm grane.\nUkloniti blizance i oštećene plodove.\nBez prorjeđivanja: sitni plodovi, lom grana, iscrpljenost stabla.\nZa mlada stabla god. 1–2 bez uroda: nije potrebno." },
    { key: "e6", title: "Berba marelice", activityType: "harvest", monthStart: 6, dayStart: 5, monthEnd: 7, dayEnd: 25, skipYear: 0, notes: "Termin ovisi o sorti ili fallback grupi — vidi PLANT_CATALOG_V1.md za harvestWindow.\nMarelica dozrijeva brzo i neravnomjerno — 2–3 prolaza kroz ~2 tjedna.\nTest zrelosti: narančasta boja s crvenim rumenilom, blago popuštanje pri pritisku.\nBrati pažljivo — lako se oštećuje i brzo trune.\nRok: 2–3 dana na sobnoj temperaturi, do 1 tjedan na 0–4°C.\nNe ostavljati prezrele plodove — privlače ose, uzrokuju moniliju.\nAko je rod manji od očekivanog → uzrok je gotovo uvijek mraz za cvatnje." }

  plum: [

function isTodoInWindow(t, daysAhead) {
  if(typeof t === "string" || !t.monthStart) return false;
  const now = new Date();
  const y = now.getFullYear();
  const start = new Date(y, t.monthStart - 1, t.dayStart);
  const end = new Date(y, t.monthEnd - 1, t.dayEnd, 23, 59, 59);
  const futureLimit = new Date(now.getTime() + daysAhead * 86400000);
  return end >= now && start <= futureLimit;
}

// ── ENCRYPTION (AES-GCM via Web Crypto API) ──
const SECURE_KEYS = ["vocnjak_gh_token", "vocnjak_gh_repo", "vocnjak_sb_url", "vocnjak_sb_key"];
const ENC_PREFIX = "enc:";

async function _getCryptoKey() {
  let userKey = localStorage.getItem("vocnjak_user_key");
  if(!userKey) { userKey = crypto.randomUUID(); localStorage.setItem("vocnjak_user_key", userKey); }
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(userKey), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: enc.encode("vocnjak_salt_2026"), iterations: 100000, hash: "SHA-256" },
    keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
  );
}

async function secureSet(name, value) {
  if(!value) { localStorage.removeItem(name); return; }
  try {
    const key = await _getCryptoKey();
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(value));
    const combined = new Uint8Array(iv.length + ciphertext.byteLength);
    combined.set(iv);
    combined.set(new Uint8Array(ciphertext), iv.length);
    localStorage.setItem(name, ENC_PREFIX + btoa(String.fromCharCode(...combined)));
  } catch(e) { localStorage.setItem(name, value); }
}

async function secureGet(name) {
  const raw = localStorage.getItem(name);
  if(!raw) return "";
  if(!raw.startsWith(ENC_PREFIX)) return raw;
  try {
    const key = await _getCryptoKey();
    const bytes = Uint8Array.from(atob(raw.slice(ENC_PREFIX.length)), c => c.charCodeAt(0));
    const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.slice(0, 12) }, key, bytes.slice(12));
    return new TextDecoder().decode(decrypted);
  } catch(e) { return ""; }
}

async function migrateSecureKeys() {
  for(const name of SECURE_KEYS) {
    const val = localStorage.getItem(name);
    if(val && !val.startsWith(ENC_PREFIX)) await secureSet(name, val);
  }
}

// ── ICAL SYNC ──
async function syncIcalOnComplete(todoText) {
  const token = await secureGet("vocnjak_gh_token");
  const repo = (await secureGet("vocnjak_gh_repo")) || "mbobanwem/vocnjak";
  if(!token) return;
  try {
    const [owner, repoName] = repo.split("/");
    const apiBase = `https://api.github.com/repos/${owner}/${repoName}/contents/vocnjak_kalendar_puni_v2.ics`;
    const res = await fetch(apiBase, { headers: { "Authorization": `token ${token}`, "Accept": "application/vnd.github.v3+json" } });
    if(!res.ok) return;
    const fileData = await res.json();
    let icsContent = atob(fileData.content.replace(/\n/g, ""));
    const needle = todoText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').slice(0, 40);
    const regex = new RegExp(`(SUMMARY:)(.*${needle}.*)`, 'i');
    if(!regex.test(icsContent)) {
      const words = todoText.split(/\s+/).filter(w => w.length > 3).slice(0, 3);
      let matched = false;
      for(const w of words) {
        const fuzzy = new RegExp(`(SUMMARY:)(.*${w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}.*)`, 'i');
        if(fuzzy.test(icsContent)) { icsContent = icsContent.replace(fuzzy, '$1✅ $2'); matched = true; break; }
      }
      if(!matched) return;
    } else {
      icsContent = icsContent.replace(regex, '$1✅ $2');
    }
    await fetch(apiBase, {
      method: "PUT",
      headers: { "Authorization": `token ${token}`, "Accept": "application/vnd.github.v3+json", "Content-Type": "application/json" },
      body: JSON.stringify({ message: `✅ ${todoText.slice(0, 50)}`, content: btoa(unescape(encodeURIComponent(icsContent))), sha: fileData.sha })
    });
  } catch(e) { console.log("iCal sync error:", e); }
}

function _getPlanReminderState(plan, v4, currentYear, now) {
  if(plan.skipYear === currentYear) return null;
  const { start: wStart, end: wEnd } = _getPlanWindow(plan, currentYear);
  const todayNorm = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startNorm = new Date(wStart.getFullYear(), wStart.getMonth(), wStart.getDate());
  const endNorm = new Date(wEnd.getFullYear(), wEnd.getMonth(), wEnd.getDate());
  const effectiveStart = new Date(startNorm); effectiveStart.setDate(effectiveStart.getDate() - 7);
  const effectiveEnd = new Date(endNorm); effectiveEnd.setDate(effectiveEnd.getDate() + 7);
  const pType = (plan.activityType || "").toLowerCase().trim();
  const hasMatch = (v4.activities || []).some(a => {
    if(!a.date) return false;
    const aType = (a.type || "").toLowerCase().trim();
    if(aType !== pType) return false;
    const ad = new Date(a.date);
    if(isNaN(ad.getTime())) return false;
    const adNorm = new Date(ad.getFullYear(), ad.getMonth(), ad.getDate());
    if(adNorm < effectiveStart || adNorm > effectiveEnd) return false;
    if(plan.appliesToAll) return true;
    return (a.plantIds || []).some(pid => (plan.plantIds || []).includes(pid));
  });
  if(hasMatch) return "done";
  if(todayNorm < startNorm) return "upcoming";
  if(todayNorm <= endNorm) return "active";
  if(todayNorm > effectiveEnd) return "missed";
  return null;
}

function _getPlanScopeLabel(plan, plants, visiblePlantIds) {
  const ids = Array.isArray(visiblePlantIds) ? visiblePlantIds : (Array.isArray(plan.plantIds) ? plan.plantIds : []);
  if(plan.appliesToAll === true && !Array.isArray(visiblePlantIds)) return "Sve biljke";
  if(plan.appliesToAll === true && Array.isArray(visiblePlantIds) && ids.length === Object.keys(plants || {}).length) return "Sve biljke";
  if(ids.length === 0) return "Bez odabranih biljki";
  return ids.map(id => (plants && plants[id] && plants[id].name) ? plants[id].name : id).join(", ");
}

function _icsDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return "" + y + m + d;
}

function _icsDateTime(date) {
  const y = date.getUTCFullYear();
  const m = String(date.getUTCMonth() + 1).padStart(2, "0");
  const d = String(date.getUTCDate()).padStart(2, "0");
  const h = String(date.getUTCHours()).padStart(2, "0");
  const min = String(date.getUTCMinutes()).padStart(2, "0");
  const s = String(date.getUTCSeconds()).padStart(2, "0");
  return "" + y + m + d + "T" + h + min + s + "Z";
}

function _icsEscape(text) {
  return String(text || "")
    .replace(/\\/g, "\\\\")
    .replace(/\r?\n/g, "\\n")
    .replace(/;/g, "\\;")
    .replace(/,/g, "\\,");
}

function _planWindowLabel(start, end) {
  const fmt = d => d.toLocaleDateString("hr-HR", { day:"numeric", month:"numeric", year:"numeric" });
  return fmt(start) + " - " + fmt(end);
}

function _buildReminderIcsV4(v4) {
  const currentYear = new Date().getFullYear();
  const now = new Date();
  const exportedAt = new Date();
  const dtstamp = _icsDateTime(exportedAt);
  const lines = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Vocnjak//Reminder Export//HR",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH"
  ];
  let count = 0;

  (v4.plans || []).forEach((plan, index) => {
    if(!_isPlanRelevantForAnyPlant(plan, v4, currentYear)) return;
    const state = _getPlanReminderState(plan, v4, currentYear, now);
    if(state !== "upcoming" && state !== "active") return;
    const { start, end } = _getPlanWindow(plan, currentYear);
    const eventEnd = new Date(start);
    eventEnd.setDate(eventEnd.getDate() + 1);
    const relevantPlantIds = _getPlanRelevantPlantIds(plan, v4, currentYear);
    const scope = _getPlanScopeLabel(plan, v4.plants || {}, relevantPlantIds);
    const title = plan.title || "Podsjetnik";
    const typeLabel = plan.activityType ? _v4TypeLabel(plan.activityType) : "";
    const descriptionParts = [
      "Prozor: " + _planWindowLabel(start, end),
      "Biljke: " + scope
    ];
    if(typeLabel) descriptionParts.push("Tip: " + typeLabel);
    if(plan.notes) descriptionParts.push("Napomene: " + plan.notes);

    lines.push(
      "BEGIN:VEVENT",
      "UID:" + _icsEscape((plan.id || ("plan-" + index)) + "-" + currentYear + "@vocnjak"),
      "DTSTAMP:" + dtstamp,
      "DTSTART;VALUE=DATE:" + _icsDate(start),
      "DTEND;VALUE=DATE:" + _icsDate(eventEnd),
      "SUMMARY:" + _icsEscape(title + " — " + scope),
      "DESCRIPTION:" + _icsEscape(descriptionParts.join("\n")),
      "END:VEVENT"
    );
    count++;
  });

  lines.push("END:VCALENDAR");
  return { content: lines.join("\r\n") + "\r\n", count };
}

async function _uploadIcsToGitHub(icsContent) {
  const token = await secureGet("vocnjak_gh_token");
  const repo = (await secureGet("vocnjak_gh_repo")) || "mbobanwem/vocnjak";
  if(!token) { showToast("Postavi GitHub token"); return false; }
  const parts = repo.split("/");
  if(parts.length !== 2 || !parts[0] || !parts[1]) { showToast("GitHub repo nije valjan"); return false; }
  const [owner, repoName] = parts;
  const apiBase = `https://api.github.com/repos/${owner}/${repoName}/contents/vocnjak_kalendar_puni_v2.ics`;
  let sha = null;
  try {
    const res = await fetch(apiBase, { headers: { "Authorization": `token ${token}`, "Accept": "application/vnd.github.v3+json" } });
    if(res.ok) {
      const fileData = await res.json();
      sha = fileData.sha || null;
    } else if(res.status !== 404) {
      showToast("❌ GitHub greška: " + res.status);
      return false;
    }
    const body = {
      message: "Update orchard reminder calendar",
      content: btoa(unescape(encodeURIComponent(icsContent)))
    };
    if(sha) body.sha = sha;
    const putRes = await fetch(apiBase, {
      method: "PUT",
      headers: { "Authorization": `token ${token}`, "Accept": "application/vnd.github.v3+json", "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if(!putRes.ok) { showToast("❌ Upload greška: " + putRes.status); return false; }
    return true;
  } catch(e) {
    showToast("❌ Greška pri iCal exportu");
    return false;
  }
}

async function exportReminderIcsToGitHub() {
  const v4 = _loadV4();
  if(!v4 || typeof v4.plants !== "object" || Array.isArray(v4.plants) || !Array.isArray(v4.activities) || !Array.isArray(v4.plans)) {
    showToast("v4 podaci nisu dostupni");

}

function _formatLastSupabaseBackup() {

  const d = new Date(raw);

  return d.toLocaleString("hr-HR", { day:"numeric", month:"long", year:"numeric", hour:"2-digit", minute:"2-digit" });
}

async function supabaseBackup() {
  const url = await secureGet("vocnjak_sb_url");
  const key = await secureGet("vocnjak_sb_key");
  if(!url || !key) { showToast("Postavi Supabase URL i key"); return false; }
  let userKey = localStorage.getItem("vocnjak_user_key");
  if(!userKey) { userKey = crypto.randomUUID(); localStorage.setItem("vocnjak_user_key", userKey); }
  const raw = localStorage.getItem("vocnjak_v4");
  if(!raw) { showToast("❌ Nema v4 podataka"); return false; }
  let backupData;
  try { backupData = JSON.parse(raw); }
  catch(e) { showToast("❌ Neispravan v4 u memoriji"); return false; }
  const hasValidBackupShape =
    backupData !== null &&
    typeof backupData === "object" &&
    !Array.isArray(backupData) &&
    typeof backupData.plants === "object" &&
    backupData.plants !== null &&
    !Array.isArray(backupData.plants) &&
    Array.isArray(backupData.activities) &&
    Array.isArray(backupData.plans);
  if(!hasValidBackupShape) {
    showToast("❌ v4 nije spreman za backup");
    return false;
  }
  try {
    const now = new Date().toISOString();
    const res = await fetch(`${url}/rest/v1/vocnjak_data`, {
      method: "POST",
      headers: { "apikey": key, "Authorization": `Bearer ${key}`, "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates" },
      body: JSON.stringify({ user_key: userKey, data: backupData, updated_at: now })
    });
    if(!res.ok) { showToast("❌ Backup greška: " + res.status); return false; }
    localStorage.setItem("vocnjak_v4_last_supabase_backup", now);
    showToast("✓ Backup spremljen");
    return true;
  } catch(e) {
    showToast("❌ Greška pri backupu");
    return false;
  }
}

async function supabaseRestore() {
  const url = await secureGet("vocnjak_sb_url");
  const key = await secureGet("vocnjak_sb_key");
  if(!url || !key) { showToast("Postavi Supabase URL i key"); return; }
  let userKey = localStorage.getItem("vocnjak_user_key");
  if(!userKey) { showToast("Nema backupa"); return; }
  try {
    const res = await fetch(`${url}/rest/v1/vocnjak_data?user_key=eq.${encodeURIComponent(userKey)}&order=updated_at.desc&limit=1&select=data`, {
      headers: { "apikey": key, "Authorization": `Bearer ${key}`, "Accept": "application/json" }
    });
    if(!res.ok) { showToast("❌ Greška: " + res.status); return; }
    const rows = await res.json();
    if(!rows.length) { showToast("Nema backupa u cloudu"); return; }

    buildPlantTabs();
    showScreen("sync");
    showToast("✓ v4 vraćen iz clouda");
  } catch(e) { showToast("❌ Greška pri restore-u"); }
}

function _genActId()  { return "act_"  + Date.now() + "_" + Math.random().toString(36).slice(2,7); }
function _genPlanId() { return "plan_" + Date.now() + "_" + Math.random().toString(36).slice(2,7); }

function _migratePlants(v3) {
  const plants = {};
  PLANTS.forEach(p => {
    const entries = v3[p.id]?.entries || [];
    const rawStatus = entries[0]?.status || "";
    plants["plant_" + p.id] = {
      id:          "plant_" + p.id,
      name:        p.name        || "",
      variety:     p.variety     || "",
      rootstock:   p.rootstock   || "",
      plantedDate: p.plantedDate || "",
      status:      STATUS_MAP_PLANT[rawStatus] || "forming",
      legacyStatus: rawStatus,
      notes:       p.notes      || ""
    };
  });
  return plants;
}

function _migrateActivities(v3) {
  const activities = [];
  PLANTS.forEach(p => {
    (v3[p.id]?.entries || []).forEach(entry => {
      activities.push({
        id:       _genActId(),
        type:     TYPE_MAP[entry.type] || "observation",
        date:     entry.date  || "",
        status:   "done",
        plantIds: ["plant_" + p.id],
        product:  "",
        notes:    entry.note  || ""
      });
    });
  });
  return activities;
}

function _migratePlans(v3) {
  const plans = [];
  PLANTS.forEach(p => {
    (v3[p.id]?.todos || []).forEach(todo => {
      if(typeof todo === "string" || !todo.monthStart) return;
      plans.push({
        id:           _genPlanId(),
        title:        todo.text    || "",
        activityType: "",
        appliesToAll: false,
        plantIds:     ["plant_" + p.id],
        monthStart:   todo.monthStart,
        dayStart:     todo.dayStart  || "",
        monthEnd:     todo.monthEnd  || "",
        dayEnd:       todo.dayEnd    || "",
        skipYear:     todo.skipYear  || "",
        notes:        ""
      });
    });
  });
  return plans;
}

function migrateV3toV4() {
  const raw = localStorage.getItem("vocnjak_v3");
  if(!raw) { console.warn("migrateV3toV4: vocnjak_v3 not found, skipping"); return; }
  if(localStorage.getItem("vocnjak_v4")) { console.warn("migrateV3toV4: vocnjak_v4 already exists, skipping"); return; }

  localStorage.setItem("vocnjak_v3_premigration", raw);
  console.log("migrateV3toV4: backup saved to vocnjak_v3_premigration");

  let v3;
  try { v3 = JSON.parse(raw); } catch(e) { console.error("migrateV3toV4: failed to parse vocnjak_v3", e); return; }

  const plants     = _migratePlants(v3);
  const activities = _migrateActivities(v3);
  const plans      = _migratePlans(v3);

  if(typeof plants !== "object" || Array.isArray(plants) || Object.keys(plants).length === 0) {
    console.error("Migration failed: plants is empty or not an object"); return;
  }
  if(!Array.isArray(activities)) { console.error("Migration failed: activities is not an array"); return; }
  if(!Array.isArray(plans))      { console.error("Migration failed: plans is not an array"); return; }

  localStorage.setItem("vocnjak_v4", JSON.stringify({ plants, activities, plans }));
  console.log("Migration complete — plants:", Object.keys(plants).length, "activities:", activities.length, "plans:", plans.length);
}

function _generatePlansForPlant(plant) {
  if (!plant || typeof plant.type !== "string") return [];
  const type = plant.type;
  let sections = [];
  const standard = ["apple", "pear", "cherry", "nectarine", "peach", "apricot", "plum"];
  if (standard.indexOf(type) !== -1) {
    sections = ["shared", type];
  } else if (type === "olive") {
    sections = ["olive"];
  } else if (type === "fig") {
    sections = ["fig"];
  } else if (type === "citrus") {
    const v = plant.variety;
    if (v === "lemon") sections = ["citrus_lemon"];
    else if (v === "orange") sections = ["citrus_orange"];
    else if (v === "mandarin") sections = ["citrus_mandarin"];
    else return [];
  } else {
    return [];
  }
  const result = [];
  for (const section of sections) {
    const entries = ORCHARD_PLAN_TEMPLATES[section] || [];
    for (const e of entries) {
      result.push({
        id: "gen:plant:" + plant.id + ":" + section + ":" + e.key,
        title: e.title,
        activityType: e.activityType,
        appliesToAll: false,
        plantIds: [plant.id],
        monthStart: e.monthStart,
        dayStart: e.dayStart,
        monthEnd: e.monthEnd,
        dayEnd: e.dayEnd,
        skipYear: 0,
        notes: e.notes
      });
    }
  }
  return result;
}

function backfillGeneratedPlans() {
  if (!confirm("Generirati nedostajuće planove za sve biljke? Postojeći planovi neće biti promijenjeni.")) return;
  const v4 = _loadV4();
  if (!v4 || typeof v4.plants !== "object") { showToast("Podaci nisu dostupni"); return; }
  if (!Array.isArray(v4.plans)) v4.plans = [];
  let added = 0;
  for (const plant of Object.values(v4.plants)) {
    const generated = _generatePlansForPlant(plant);
    for (const gp of generated) {
      if (!v4.plans.some(p => p && p.id === gp.id)) {
        v4.plans.push(gp);
        added++;
      }
    }
  }
  try {
    localStorage.setItem("vocnjak_v4", JSON.stringify(v4));
  } catch(e) { showToast("Greška pri spremanju"); return; }
  showToast(added > 0 ? "Dodano " + added + " planova." : "Nema novih planova");
  showScreen("plants");
}

function _v4PlansThisMonth(plans) {
  const month = new Date().getMonth() + 1; // 1-based
  return plans.filter(pl => {
    const start = pl.monthStart;
    const end   = pl.monthEnd || pl.monthStart;
    return month >= start && month <= end;
  }).length;
}

function _v4ActivitiesThisWeek(activities) {
  const now   = new Date();
  const day   = now.getDay(); // 0=Sun
  const diff  = (day === 0 ? -6 : 1 - day); // shift to Monday
  const mon   = new Date(now); mon.setDate(now.getDate() + diff); mon.setHours(0,0,0,0);
  const sun   = new Date(mon); sun.setDate(mon.getDate() + 6); sun.setHours(23,59,59,999);
  return activities.filter(a => {
    if(!a.date) return false;
    const d = new Date(a.date);
    return d >= mon && d <= sun;
  }).length;
}

function _getPlanWindow(plan, year) {
  const start = new Date(year, plan.monthStart - 1, plan.dayStart || 1);
  const endMonth = plan.monthEnd || plan.monthStart;
  const endDay = plan.dayEnd || new Date(year, endMonth, 0).getDate();
  const end = new Date(year, endMonth - 1, endDay, 23, 59, 59);
  return { start, end };
}

function _isYoungTree(plant, now) {
  if(!plant) return false;
  if(plant.status === "forming") return true;
  if(!plant.plantedDate) return false;
  const d = new Date(plant.plantedDate);
  if(isNaN(d.getTime())) return false;
  const cutoff = new Date(now || new Date());
  cutoff.setFullYear(cutoff.getFullYear() - 1);
  return d >= cutoff;
}

function _normalizePlanTitle(title) {
  return String(title || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d")
    .replace(/[–—]/g, "-");
}

function _isYoungTreeBlockedPlan(plan) {
  const type = (plan.activityType || "").toLowerCase().trim();
  if(type === "harvest") return true;

  const title = _normalizePlanTitle(plan.title);
  const blockedTitles = [
    "prorjedivanje plodova",
    "prorjedivanje plodova - kruska",
    "prorjedivanje tresnje (po potrebi)",
    "prorjedivanje plodova - nektarina",
    "prorjedivanje plodova - breskva",
    "prorjedivanje plodova - marelica",
    "prorjedivanje plodova - sljiva",
    "mreza protiv ptica - jabuka",
    "mreza protiv ptica - kruska",
    "mreza protiv ptica - tresnja",
    "mreza protiv ptica - nektarina",
    "mreza protiv ptica - breskva",
    "mreza protiv ptica - sljiva",
    "pracenje jabucnog savijaca (feromonske klopke)",
    "pracenje sljivinog savijaca (feromonske klopke)",
    "pracenje tresnjine muhe - zute ljepljive ploce",
    "pracenje maslinove muhe",
    "gasenje navodnjavanja",
    "post-bloom zastita - krastavost i pepelnica",
    "post-bloom zastita - krastavost kruske",
    "post-bloom zastita - monilija i stetnici",
    "post-bloom zastita - monilija (marelica)",
    "post-bloom zastita - monilija i sljivin savijac"
  ];
  return blockedTitles.includes(title);
}

function _planAppliesToPlant(plan, plantId) {
  if(plan.appliesToAll === true) return true;
  return (plan.plantIds || []).includes(plantId);
}

function _isPlanRelevantForPlant(plan, plant, v4, year) {
  if(!_isYoungTree(plant)) return true;
  return !_isYoungTreeBlockedPlan(plan);
}

function _getPlanRelevantPlantIds(plan, v4, year) {
  const plants = (v4 && v4.plants) || {};
  const ids = plan.appliesToAll === true ? Object.keys(plants) : (plan.plantIds || []);
  return ids.filter(pid => {
    const plant = plants[pid];
    if(!plant) return false;
    if(!_planAppliesToPlant(plan, pid)) return false;
    return _isPlanRelevantForPlant(plan, plant, v4, year);
  });
}

function _isPlanRelevantForAnyPlant(plan, v4, year) {
  const ids = plan.appliesToAll === true ? Object.keys((v4 && v4.plants) || {}) : (plan.plantIds || []);
  if(ids.length === 0) return !_isYoungTreeBlockedPlan(plan);
  return _getPlanRelevantPlantIds(plan, v4, year).length > 0;
}

function _v4DashboardPlans(v4) {
  const now = new Date();
  const year = now.getFullYear();
  const { plans = [], activities = [] } = v4;
  return plans.map(pl => {
    if(pl.skipYear === year) return null;
    if(!_isPlanRelevantForAnyPlant(pl, v4, year)) return null;
    const { start: wStart, end: wEnd } = _getPlanWindow(pl, year);
    // Tolerance ±7 days for matching (DOMAIN_RULES 5.6)
    const effectiveStart = new Date(wStart); effectiveStart.setDate(effectiveStart.getDate() - 7);
    const effectiveEnd = new Date(wEnd); effectiveEnd.setDate(effectiveEnd.getDate() + 7);
    // Check matching activity FIRST — done overrides all (DOMAIN_RULES 5.4)
    const pType = (pl.activityType || "").toLowerCase().trim();
    const hasMatch = activities.some(a => {
      if(!a.date) return false;
      const aType = (a.type || "").toLowerCase().trim();
      if(aType !== pType) return false;
      const ad = new Date(a.date);
      if(isNaN(ad.getTime())) return false;
      if(ad < effectiveStart || ad > effectiveEnd) return false;
      if(pl.appliesToAll) return true;
      return (a.plantIds || []).some(pid => (pl.plantIds || []).includes(pid));
    });
    let state;
    if(hasMatch) {
      state = "done";
    } else if(now < wStart) {
      state = "upcoming";
    } else if(now <= wEnd) {
      state = "active";
    } else {
      state = "missed";
    }
    return { title: pl.title || "", activityType: pl.activityType || "", state };
  }).filter(Boolean);
}

function _v4HasYoungTree(plants) {
  return Object.values(plants).some(p => {
    return _isYoungTree(p);
  });
}

function _v4TypeLabel(type) {
  const map = { spraying:"Prskanje", pruning:"Rezidba", fertilizing:"Gnojidba", watering:"Navodnjavanje", planting:"Sadnja", harvest:"Berba", observation:"Opservacija", problem:"Problem", monitoring:"Monitoring" };

// ── TRIGGER ENGINE (V2) ──
function getRecommendationsV2(v4, plantId, currentDateStr) {
  const { plants = {}, activities = [], plans = [] } = v4;
  if(!plants[plantId]) return [];

  // Consistent day-level basis — local YYYY-MM-DD
  if(!currentDateStr || !/^\d{4}-\d{2}-\d{2}$/.test(currentDateStr)) {
    const n = new Date();
    currentDateStr = n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0");
  }
  const [curY, curM, curD] = currentDateStr.split("-").map(Number);

  const plantActivities = activities
    .filter(a => Array.isArray(a.plantIds) && a.plantIds.includes(plantId))
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""));

  function daysAgo(dateStr, n) {
    if(!dateStr || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return false;
    const [y, m, d] = dateStr.split("-").map(Number);
    const actDate = new Date(Date.UTC(y, m - 1, d));
    const refDate = new Date(Date.UTC(curY, curM - 1, curD));
    const diff = (refDate - actDate) / (1000 * 60 * 60 * 24);
    return diff >= 0 && diff <= n;
  }

  const lastMonitoring = plantActivities.find(a => a.type === "monitoring");
  const lastSpraying = plantActivities.find(a => a.type === "spraying");
  const hasRecentSpraying5 = lastSpraying && daysAgo(lastSpraying.date, 5);
  const hasRecentSpraying7 = lastSpraying && daysAgo(lastSpraying.date, 7);
  const hasRecentMonitoring14 = lastMonitoring && daysAgo(lastMonitoring.date, 14);
  const monNotes = lastMonitoring?.notes || "";

  const recs = [];

  // Rule A1 — aphids low
  if(monNotes === "monitoring:aphids_low" && !hasRecentSpraying5) {
    recs.push({ kind:"pest", urgency:"medium", actionCategory:"inspect", confidence:"moderate", message:"Niska prisutnost lisnih uši — prati stanje i ponovi pregled.", productHintLevel:"none" });
  }

  // Rule A2 — aphids medium/high
  if((monNotes === "monitoring:aphids_medium" || monNotes === "monitoring:aphids_high") && !hasRecentSpraying5) {
    recs.push({ kind:"pest", urgency:"high", actionCategory:"insecticide", confidence:"moderate", message:"Značajna prisutnost lisnih uši — razmotri tretman ako se ponavlja.", productHintLevel:"category" });
  }

  // Rule T1 — trap warning
  if(monNotes === "monitoring:trap_6_20") {
    recs.push({ kind:"monitoring", urgency:"medium", actionCategory:"inspect", confidence:"moderate", message:"Povećan broj ulova — pregledaj biljku.", productHintLevel:"none" });
  }

  // Rule T2 — trap action
  if(monNotes === "monitoring:trap_20_plus") {
    recs.push({ kind:"pest", urgency:"high", actionCategory:"insecticide", confidence:"moderate", message:"Visok broj ulova — moguća pojava štetnika.", productHintLevel:"category" });
  }

  // Rule F1 — fungus single leaf
  if(monNotes === "monitoring:fungus_single_leaf" && !hasRecentSpraying7) {
    recs.push({ kind:"disease", urgency:"medium", actionCategory:"inspect", confidence:"moderate", message:"Mogući početak bolesti — prati stanje.", productHintLevel:"none" });
  }

  // Rule F2 — fungus multiple leaves
  if(monNotes === "monitoring:fungus_multiple_leaves" && !hasRecentSpraying7) {
    recs.push({ kind:"disease", urgency:"high", actionCategory:"fungicide", confidence:"moderate", message:"Širenje simptoma — razmotri zaštitu.", productHintLevel:"category" });
  }

  // Rule M1 — no recent monitoring (Apr–Sep only)
  if(!hasRecentMonitoring14) {
    if(curM >= 4 && curM <= 9) {
      recs.push({ kind:"monitoring", urgency:"medium", actionCategory:"inspect", confidence:"moderate", message:"Nema nedavnog pregleda — provjeri stanje biljke.", productHintLevel:"none" });
    }
  }

  // Rule P1 — active plan
  const hasActivePlan = plans.some(pl => {
    if(pl.skipYear === curY) return false;
    if(!pl.appliesToAll && !(pl.plantIds || []).includes(plantId)) return false;
    const { start: wStart, end: wEnd } = _getPlanWindow(pl, curY);
    const curDate = new Date(curY, curM - 1, curD, 12, 0, 0);
    return curDate >= wStart && curDate <= wEnd;
  });
  if(hasActivePlan) {
    recs.push({ kind:"plan", urgency:"low", actionCategory:"monitoring", confidence:"moderate", message:"Aktivan plan rada za ovu biljku.", productHintLevel:"none" });
  }

  // Dedupe by kind + actionCategory + message
  const seen = new Set();
  const unique = recs.filter(r => {
    const key = r.kind + "|" + r.actionCategory + "|" + r.message;
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  // Sort by urgency: high → medium → low, limit to 3
  const urgencyOrder = { high: 0, medium: 1, low: 2 };
  unique.sort((a, b) => (urgencyOrder[a.urgency] ?? 3) - (urgencyOrder[b.urgency] ?? 3));
  return unique.slice(0, 3);
}

// ── RECOMMENDATION ENGINE V1 (plan + activity + plant status) ──
function _getYoungTreeFormativeReminder(plant, now) {
  if(!plant || !_isYoungTree(plant, now)) return null;
  if(!plant.plantedDate || !/^\d{4}-\d{2}-\d{2}$/.test(plant.plantedDate)) return null;
  const [py, pm, pd] = plant.plantedDate.split("-").map(Number);
  const planted = new Date(py, pm - 1, pd);
  if(isNaN(planted.getTime())) return null;
  if(planted.getFullYear() !== py || planted.getMonth() !== pm - 1 || planted.getDate() !== pd) return null;
  const todayRaw = now || new Date();
  const today = new Date(todayRaw.getFullYear(), todayRaw.getMonth(), todayRaw.getDate());
  const target = new Date(planted);
  target.setDate(target.getDate() + 60);
  const start = new Date(target);
  start.setDate(start.getDate() - 15);
  const end = new Date(target);
  end.setDate(end.getDate() + 15);
  if(today < start || today > end) return null;
  return {
    urgency: "medium",
    actionCategory: "inspect",
    title: "Formiranje krošnje – odabir grana",
    message: "Pregledaj mlade izboje. Kad dosegnu 10–20 cm, ostavi 3–4 najjače grane pravilno raspoređene oko debla i ukloni ostale."
  };
}

function getRecommendationsV1(v4, plantId) {
  const recs = [];
  const plant = (v4.plants || {})[plantId];
  if(!plant) return recs;
  const now = new Date();
  const year = now.getFullYear();
  const cm = now.getMonth() + 1;

  // Rule 1 — single aggregated active-plan prompt
  let activePlanPushed = false;
  const plans = v4.plans || [];
  for(let i = 0; i < plans.length && !activePlanPushed; i++) {
    const pl = plans[i];
    if(pl.skipYear === year) continue;
    if(!pl.appliesToAll && !(pl.plantIds || []).includes(plantId)) continue;
    const { start: wStart, end: wEnd } = _getPlanWindow(pl, year);
    if(now < wStart || now > wEnd) continue;
    const effStart = new Date(wStart); effStart.setDate(effStart.getDate() - 7);
    const effEnd   = new Date(wEnd);   effEnd.setDate(effEnd.getDate() + 7);
    const pType = (pl.activityType || "").toLowerCase().trim();
    const hasMatch = (v4.activities || []).some(a => {
      if(!a.date) return false;
      if((a.type || "").toLowerCase().trim() !== pType) return false;
      const ad = new Date(a.date);
      if(isNaN(ad.getTime())) return false;
      if(ad < effStart || ad > effEnd) return false;
      if(pl.appliesToAll) return true;
      return (a.plantIds || []).some(pid => (pl.plantIds || []).includes(pid));
    });
    if(!hasMatch) {
      recs.push({ urgency: "medium", actionCategory: "inspect", message: "Plan je aktivan — potrebno izvršiti" });
      activePlanPushed = true;
    }
  }

  // Rule 2 — young plant notice (informational)
  const pd = plant.plantedDate ? new Date(plant.plantedDate) : null;
  const cutoffY = new Date(); cutoffY.setFullYear(cutoffY.getFullYear() - 1);
  const isYoung = plant.status === "forming" || (pd !== null && !isNaN(pd.getTime()) && pd >= cutoffY);
  if(isYoung) {
    recs.push({ urgency: "low", actionCategory: "monitoring", message: "Biljka je mlada — fokus na razvoj, ne na rod" });
  }

  const formativeReminder = _getYoungTreeFormativeReminder(plant, now);
  if(formativeReminder) {
    recs.push(formativeReminder);
  }

  // Rule 3 — watering gap (months 4–9, 14-day threshold)
  if(cm >= 4 && cm <= 9) {
    const cutoffW = new Date(); cutoffW.setDate(cutoffW.getDate() - 14);
    const hasRecentWater = (v4.activities || []).some(a => {
      if(!a.date) return false;
      if((a.type || "").toLowerCase().trim() !== "watering") return false;
      const ad = new Date(a.date);
      if(isNaN(ad.getTime())) return false;
      if(ad < cutoffW) return false;
      return (a.plantIds || []).includes(plantId);
    });
    if(!hasRecentWater) {
      recs.push({ urgency: "medium", actionCategory: "inspect", message: "Provjeri zalijevanje" });
    }
  }

  return recs;
}

function renderOverview() {

function _renderOverviewV4(mc, v4) {
  const { plants = {}, activities = [] } = v4;
  const monthNames = ["Siječanj","Veljača","Ožujak","Travanj","Svibanj","Lipanj","Srpanj","Kolovoz","Rujan","Listopad","Studeni","Prosinac"];
  const now = new Date();
  const year = now.getFullYear();

  const dashPlans = _v4DashboardPlans(v4);

  const recent = activities.slice().sort((a, b) => {
    const da = new Date(a.date || 0), db = new Date(b.date || 0);
    return db - da;
  }).slice(0, 2);

  const plantIds = Object.keys(plants);
  const v2ActionLabel = { inspect:"Pregledaj", insecticide:"Razmotri zaštitu", fungicide:"Razmotri fungicid", monitoring:"Prati", wait:"Pričekaj" };

  // Active dashboard plans — local walk mirroring active-state derivation, enriched with
  // effective plantIds so young-tree status uses the same _isYoungTree rule as rec items.
  const activePlans = [];
  for(const pl of (v4.plans || [])) {
    if(pl.skipYear === year) continue;
    if(!_isPlanRelevantForAnyPlant(pl, v4, year)) continue;
    const { start: wStart, end: wEnd } = _getPlanWindow(pl, year);
    if(now < wStart || now > wEnd) continue;
    const effStart = new Date(wStart); effStart.setDate(effStart.getDate() - 7);
    const effEnd = new Date(wEnd); effEnd.setDate(effEnd.getDate() + 7);
    const pType = (pl.activityType || "").toLowerCase().trim();
    const hasMatch = (v4.activities || []).some(a => {
      if(!a.date) return false;
      if((a.type || "").toLowerCase().trim() !== pType) return false;
      const ad = new Date(a.date);
      if(isNaN(ad.getTime())) return false;
      if(ad < effStart || ad > effEnd) return false;
      if(pl.appliesToAll) return true;
      return (a.plantIds || []).some(pid => (pl.plantIds || []).includes(pid));
    });
    if(hasMatch) continue;
    const pids = _getPlanRelevantPlantIds(pl, v4, year);
    const hasYoung = pids.some(pid => plants[pid] && _isYoungTree(plants[pid]));
    activePlans.push({
      title: pl.title || "",
      activityType: pl.activityType || "",
      plantIds: pids,
      _young: hasYoung
    });
  }

  const danasItems = [];
  const seen = new Set();

  // Active plans — WHAT (plan title) + WHY (activity-type label).
  for(const p of activePlans) {
    danasItems.push({
      title: p.title,
      subtitle: _v4TypeLabel(p.activityType),
      urgency: "medium",
      origin: "plan",
      isMonitoring: false,
      isFormative: false,
      _young: p._young
    });
  }

  // V2 recommendations + formative reminder (single source: _getYoungTreeFormativeReminder),
  // both deduped through the same `seen` set keyed on message.
  for(const pid of plantIds) {
    const plant = plants[pid];
    const recs = getRecommendationsV2(v4, pid);
    for(const r of recs) {
      if(r.kind === "plan") continue; // duplicates active-plan item
      if(seen.has(r.message)) continue;
      seen.add(r.message);
      danasItems.push({
        title: v2ActionLabel[r.actionCategory] || r.actionCategory || "",
        subtitle: r.message,
        disclaimer: r.productHintLevel === "category" ? "Provjeri stadij biljke i lokalnu registraciju prije primjene." : "",
        urgency: r.urgency,
        origin: "rec",
        isMonitoring: r.actionCategory === "monitoring",
        isFormative: false,
        _young: !!(plant && _isYoungTree(plant))
      });
    }
    const formative = _getYoungTreeFormativeReminder(plant, now);
    if(formative && !seen.has(formative.message)) {
      seen.add(formative.message);
      const pd = new Date(plant.plantedDate);
      const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const planted0 = new Date(pd.getFullYear(), pd.getMonth(), pd.getDate());
      const daysSince = Math.floor((today0 - planted0) / (1000 * 60 * 60 * 24));
      danasItems.push({
        title: formative.title,
        subtitle: formative.message,
        urgency: formative.urgency,
        origin: "rec",
        isMonitoring: false,
        isFormative: true,
        formativeDay: daysSince,
        _young: true
      });
    }
  }

  const urgencyOrder = { high: 0, medium: 1, low: 2 };
  danasItems.sort((a, b) => {
    const ua = urgencyOrder[a.urgency] ?? 3;
    const ub = urgencyOrder[b.urgency] ?? 3;
    if(ua !== ub) return ua - ub;
    if(a.isMonitoring !== b.isMonitoring) return a.isMonitoring ? 1 : -1;
    return 0;
  });

  const totalDanas = danasItems.length;
  const visibleDanas = danasItems.slice(0, 3);
  const overflow = totalDanas - visibleDanas.length;

  let danasHTML = '<div style="font-size:16px;font-weight:600;color:var(--green-deep);margin-bottom:10px">Danas</div>';
  if(totalDanas === 0) {
    danasHTML += `<div class="card" style="padding:12px 14px;margin-bottom:6px">
      <div style="font-size:14px;font-weight:600;color:var(--green-deep)">Danas ništa hitno.</div>
      <div style="font-size:12px;color:var(--text-mid);margin-top:4px">Sve je mirno — provjeri ponovno uskoro.</div>
    </div>`;
  } else {
    danasHTML += visibleDanas.map(_renderDanasItem).join("");
    if(overflow > 0) {
      danasHTML += `<div style="font-size:11px;color:var(--text-light);margin-top:4px;padding-left:4px">+ još ${overflow}</div>`;
    }
  }

  // Session 16 — weather visibility: ONLY when an active spraying plan exists
  const hasActiveSprayingPlan = dashPlans.some(p => p.activityType === "spraying" && p.state === "active");
  const showWeather = hasActiveSprayingPlan
    && weatherData
    && Array.isArray(weatherData.time)
    && weatherData.time.length >= 3
    && Array.isArray(weatherData.temperature_2m_min)
    && Array.isArray(weatherData.temperature_2m_max)
    && Array.isArray(weatherData.precipitation_sum);
  let weatherHTML = "";
  if(showWeather) {
    const dn = ["Danas","Sutra","Prekosutra"];
    weatherHTML = `<div class="weather-card" style="margin-top:16px">
      <div style="font-size:10px;font-weight:600;color:var(--text-light);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px">Zagreb — prognoza</div>
      <div class="weather-row">
        ${[0,1,2].map((i,idx) => `
          ${idx > 0 ? '<div class="weather-divider"></div>' : ''}
          <div class="weather-day">
            <div class="weather-day-label">${dn[i]}</div>
            <div class="weather-temp">${Math.round(weatherData.temperature_2m_min[i])}° / ${Math.round(weatherData.temperature_2m_max[i])}°</div>
            <div class="weather-rain">${weatherData.precipitation_sum[i] > 0 ? '🌧 ' + weatherData.precipitation_sum[i].toFixed(1) + 'mm' : '☀️ suho'}</div>
          </div>
        `).join("")}
      </div>
    </div>`;
  }

  mc.innerHTML = `
    <div style="font-size:11px;color:var(--text-light);margin-bottom:10px">${monthNames[now.getMonth()]} ${now.getFullYear()}</div>
    ${danasHTML}
    ${weatherHTML}
    <div class="section-label" style="margin-top:16px">Zadnje aktivnosti</div>
    ${recent.length === 0
      ? '<div class="empty">Nema zabilježenih aktivnosti.</div>'
      : recent.map(a => {
          const dt = a.date ? new Date(a.date) : null;
          const dateStr = dt ? `${dt.getDate()}.${dt.getMonth()+1}.` : "";
          const pCount = (a.plantIds || []).length;
          const plantLabel = pCount === 0 ? "Sve biljke" : pCount === 1 ? (v4.plants[(a.plantIds||[])[0]]?.name || "1 biljka") : pCount + " biljki";
          return `<div class="card" style="padding:10px 14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-size:13px;font-weight:500">${_v4TypeLabel(a.type)}</div>
              <div style="font-size:11px;color:var(--text-light)">${plantLabel}</div>
            </div>
            <div style="font-size:11px;color:var(--text-light)">${dateStr}</div>
          </div>`;
        }).join("")}
    ${activities.length > 0 ? '<div style="margin-top:10px;text-align:center"><button onclick="showActivitiesScreen()" style="background:none;border:none;color:var(--green-deep);font-size:13px;cursor:pointer;text-decoration:underline">Sve aktivnosti →</button></div>' : ''}
  `;
}

function _renderOverviewLegacy(mc) {
  const now = new Date();

  const allTodos = PLANTS.reduce((s,p) => s + (data[p.id]?.todos?.length||0), 0);

      <div class="alert-title">📌 ${a.title}</div>
      <div class="alert-body">${a.body}</div>

        <button class="alert-btn" onclick="dismissAlert('${a.id}')">Zanemari</button>
      </div>
    </div>
  `).join("");

  let weatherHTML = "";
  if(weatherData) {
    const dn = ["Danas","Sutra","Prekosutra"];
    const rainToday = weatherData.precipitation_sum[0];
    const rainTomorrow = weatherData.precipitation_sum[1];

    const sprayKeywords = ["prskanje","ulje","bakar","cuprablau","score","mospilan"];
    const hasSprayTodos = PLANTS.some(p => (data[p.id]?.todos||[]).some(t => {
      const txt = todoText(t).toLowerCase();
      const isSpray = sprayKeywords.some(k => txt.includes(k));
      if(!isSpray) return false;
      if(typeof t === "string" || !t.monthStart) return false;
      return isTodoInWindow(t, 14);
    }));

    let dryWindowHTML = "";
    if(hasSprayTodos) {
      const precip = weatherData.precipitation_sum;
      const dates = weatherData.time;
      let dryStart = -1, dryEnd = -1;
      for(let i = 0; i < precip.length; i++) {
        if(precip[i] < 1) {
          if(dryStart === -1) dryStart = i;
          dryEnd = i;
          if(dryEnd - dryStart >= 1) break;
        } else { dryStart = -1; dryEnd = -1; }
      }
      if(dryStart !== -1 && dryEnd - dryStart >= 1) {
        const fmt = d => new Date(d).toLocaleDateString("hr-HR", { weekday:"short", day:"numeric", month:"short" });
        dryWindowHTML = `<div style="background:#d1fae5;border:1px solid #6ee7b7;border-radius:var(--r-sm);padding:8px 12px;margin-top:10px;font-size:12px;color:#065f46;line-height:1.4">✅ Suhi prozor za prskanje: ${fmt(dates[dryStart])} – ${fmt(dates[dryEnd])}</div>`;
      } else {
        dryWindowHTML = `<div class="weather-warn" style="margin-top:10px">⚠️ Nema suhog prozora u sljedećih 7 dana — prati prognozu</div>`;
      }
    }

    const warnRain = hasSprayTodos && (rainToday > 1 || rainTomorrow > 1);

    weatherHTML = `<div class="weather-card">
      <div style="font-size:10px;font-weight:600;color:var(--text-light);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px">Zagreb — prognoza</div>
      <div class="weather-row">
        ${[0,1,2].map((i,idx) => `
          ${idx > 0 ? '<div class="weather-divider"></div>' : ''}
          <div class="weather-day">
            <div class="weather-day-label">${dn[i]}</div>
            <div class="weather-temp">${Math.round(weatherData.temperature_2m_min[i])}° / ${Math.round(weatherData.temperature_2m_max[i])}°</div>
            <div class="weather-rain">${weatherData.precipitation_sum[i] > 0 ? '🌧 ' + weatherData.precipitation_sum[i].toFixed(1) + 'mm' : '☀️ suho'}</div>
          </div>
        `).join("")}
      </div>
      ${warnRain ? `<div class="weather-warn">⚠️ Ne prskaj ${rainToday > 1 ? 'danas' : 'sutra'} — očekuje se kiša (${rainToday > 1 ? rainToday.toFixed(1) : rainTomorrow.toFixed(1)}mm)</div>` : ''}
      ${dryWindowHTML}
    </div>`;
  }

  mc.innerHTML = `
    ${weatherHTML}
    ${alertsHTML}

    <div class="overview-stats">
      <div class="stat-card clickable" onclick="showDetailView('todos')">
        <div class="stat-num">${allTodos}</div>
        <div class="stat-label">Otvoreni zadaci</div>
        <div class="stat-arrow">Pogledaj sve →</div>
      </div>
      <div class="stat-card clickable" onclick="showDetailView('month')">
        <div class="stat-num">${monthTasks}</div>
        <div class="stat-label">Ovaj mjesec</div>
        <div class="stat-arrow">Raspored →</div>
      </div>
      <div class="stat-card clickable" onclick="showDetailView('hitno')">
        <div class="stat-num ${hitnoPlants > 0 ? 'red' : ''}">${hitnoPlants}</div>
        <div class="stat-label">Hitno</div>
        <div class="stat-arrow">${hitnoPlants > 0 ? 'Pogledaj →' : 'Sve uredno'}</div>
      </div>
      <div class="stat-card clickable" onclick="showScreen('plants')">
        <div class="stat-num">${totalPlants}</div>
        <div class="stat-label">Biljke</div>
        <div class="stat-arrow">Pogledaj sve →</div>
      </div>
    </div>

    <div class="section-label">Stanje biljki</div>
    ${PLANTS.map(p => {
      if(!data[p.id]) return "";
      const st = data[p.id].entries[0]?.status || "dobro";
      const sc = STATUS_COLORS[st];
      const tc = data[p.id].todos.length;
      return `<div class="plant-card" onclick="showScreen('plants'); setActivePlant('${p.id}')">
        <div class="plant-card-accent" style="background:${sc.stripe}"></div>
        <div class="plant-card-body">
          <div class="plant-card-top">
            <div class="plant-card-name">${p.emoji} ${p.name}</div>
            <div class="status-badge ${sc.cls}"><span class="status-dot"></span>${STATUS_LABELS[st]}</div>
          </div>
          <div class="plant-card-sub">${p.subtitle}</div>
          ${tc > 0 ? `<div class="plant-card-todos">📋 ${tc} zadatak${tc > 1 ? 'a' : ''}</div>` : ""}
