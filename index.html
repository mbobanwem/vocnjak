  function renderList() {
    setViews('list');
    clearNode(listView);

    var topbar = makeEl('div', 'v2-plants-topbar');
    topbar.appendChild(makeEl('h2', '', 'Biljke'));
    var addBtn = makeEl('button', 'v2-plants-primary', 'Dodaj voćku');
    addBtn.type = 'button';
    addBtn.addEventListener('click', function () { location.hash = '#v2/add'; });
    topbar.appendChild(addBtn);
    listView.appendChild(topbar);

    var activityActions = makeEl('div', 'v2-activity-actions');
    var pregledBtn = makeEl('button', 'v2-plants-secondary', 'Pregled');
    pregledBtn.type = 'button';
    pregledBtn.addEventListener('click', function () { location.hash = '#v2/pregled'; });
    var calendarBtn = makeEl('button', 'v2-plants-secondary', 'Kalendar');
    calendarBtn.type = 'button';
    calendarBtn.addEventListener('click', function () { location.hash = '#v2/kalendar'; });
    var addActivity = makeEl('button', 'v2-plants-primary', 'Dodaj evidenciju');
    addActivity.type = 'button';
    addActivity.addEventListener('click', function () { location.hash = '#v2/activity/add'; });
    var diaryBtn = makeEl('button', 'v2-plants-secondary', 'Dnevnik');
    diaryBtn.type = 'button';
    diaryBtn.addEventListener('click', function () { location.hash = '#v2/diary'; });
    activityActions.appendChild(pregledBtn);
    activityActions.appendChild(calendarBtn);
    activityActions.appendChild(addActivity);
    activityActions.appendChild(diaryBtn);
    listView.appendChild(activityActions);

    var result = readValidStore();
    if (!result.ok) {
      listView.appendChild(makeEl('p', 'v2-plants-error', result.error));
      return;
    }

    var plants = result.store.plants.slice().sort(function (a, b) {
      return a.stable_order - b.stable_order;
    });

    if (plants.length === 0) {
      listView.appendChild(makeEl('p', 'v2-plants-empty', 'Još nema unesenih voćki.'));
      return;
    }

    var activeList = activePlants(plants);
    var archivedList = archivedPlants(plants);

    if (activeList.length === 0) {
      listView.appendChild(makeEl('p', 'v2-plants-empty', 'Nema aktivnih voćki.'));

      var plant = activeList[i];
      var row = makeEl('button', 'v2-plants-row');
      row.type = 'button';
      row.dataset.plantId = plant.plant_id;
      row.addEventListener('click', function (event) {
        location.hash = plantDetailRoute(event.currentTarget.dataset.plantId);
      });
      row.appendChild(makeEl('span', 'v2-plants-row-title', plantTitle(plant)));
      var bits = [];
      if (typeof plant.position_label === 'string') bits.push('Položaj: ' + plant.position_label);
      else if (isUnknownTag(plant.position_label)) bits.push('Položaj: ne znam');
      if (typeof plant.rootstock === 'string') bits.push('Podloga: ' + plant.rootstock);
      else if (isUnknownTag(plant.rootstock)) bits.push('Podloga: ne znam');
      if (bits.length > 0) row.appendChild(makeEl('span', 'v2-plants-row-meta', bits.join(' · ')));
      list.appendChild(row);
    }
    if (activeList.length > 0) listView.appendChild(list);

    if (archivedList.length > 0) {
      var archiveSection = makeEl('section', 'v2-plants-section');
      archiveSection.appendChild(makeEl('h3', '', 'Arhivirane voćke'));
      var archiveRows = makeEl('div', 'v2-plants-list');
      for (var a = 0; a < archivedList.length; a++) {
        var archived = archivedList[a];
        var archiveRow = makeEl('button', 'v2-plants-row');
        archiveRow.type = 'button';
        archiveRow.dataset.plantId = archived.plant_id;
        archiveRow.addEventListener('click', function (event) {
          location.hash = plantDetailRoute(event.currentTarget.dataset.plantId);
        });
        archiveRow.appendChild(makeEl('span', 'v2-plants-row-title', plantTitleWithArchiveMarker(archived)));
        var archiveBits = ['Arhivirana: ' + formatDateYmd(archived.archived_at)];
        var reason = archiveReasonLabel(archived.archive_reason);
        if (reason) archiveBits.push(reason);
        archiveRow.appendChild(makeEl('span', 'v2-plants-row-meta', archiveBits.join(' · ')));
        archiveRows.appendChild(archiveRow);
      }
      archiveSection.appendChild(archiveRows);
      listView.appendChild(archiveSection);
    }

  function appendPlantDetailB2Section(parent, title, items, plant, plants) {
    if (!items.length) return;
    var section = makeEl('section', 'v2-plants-section');
    section.appendChild(makeEl('h3', '', title));

      var card = makeEl('article', 'v2-seasonal-card');
      card.appendChild(makeEl('p', 'v2-seasonal-card-title', items[i].label));

      card.appendChild(makeEl('span', 'v2-seasonal-note', items[i].note));
      if (items[i].guidance && Array.isArray(items[i].guidance.bullets) && items[i].guidance.bullets.length > 0) {
        card.appendChild(makeEl('span', 'v2-seasonal-meta', items[i].guidance.label + ':'));

    parent.appendChild(makeEl('span', 'v2-seasonal-meta', 'Što sada:'));

  }

  function appendScoutingObservationCaptureControls(parent, plant, plants, source) {

    var opener = makeEl('button', 'v2-plants-secondary', 'Zabilježi vizualni pregled');

    message.hidden = true;
    form.appendChild(message);

    var dateInput = document.createElement('input');

    appendField(form, 'v2ScoutingObservedOn_' + source.source_entry_id, 'Datum', dateInput);

    form.appendChild(makeEl('small', 'v2-plants-hint', 'Bilježi samo ono što si vidio/la — ne procjenu stanja voćke.'));

    noneChoice.appendChild(noneRadio);
    noneChoice.appendChild(document.createTextNode('Nema vidljivih znakova'));
    form.appendChild(noneChoice);

    var presentChoice = makeEl('label', 'v2-plants-check');
    var presentRadio = document.createElement('input');
    presentRadio.type = 'radio';
    presentRadio.name = radioName;
    presentRadio.value = 'present';
    presentChoice.appendChild(presentRadio);
    presentChoice.appendChild(document.createTextNode('Ima vidljivih znakova'));
    form.appendChild(presentChoice);

    var signWrap = makeEl('div', 'v2-plants-field');
    signWrap.hidden = true;
    signWrap.appendChild(makeEl('label', '', 'Vidljivi znakovi'));
    var signInputs = [];
    for (var i = 0; i < source.sign_choices.length; i++) {
      var sign = source.sign_choices[i];
      var signChoice = makeEl('label', 'v2-plants-check');
      var signInput = document.createElement('input');
      signInput.type = 'checkbox';

      signChoice.appendChild(document.createTextNode(sign.label_hr));

    save.disabled = true;
    var cancel = makeEl('button', 'v2-plants-secondary', 'Odustani');
    cancel.type = 'button';
    actions.appendChild(save);
    actions.appendChild(cancel);
    form.appendChild(actions);

    function refreshScoutingState() {
      signWrap.hidden = !presentRadio.checked;
      if (!presentRadio.checked) {
        for (var i = 0; i < signInputs.length; i++) signInputs[i].checked = false;
      }
      var signCount = selectedScoutingSignKeys(signInputs).length;
      if (noneRadio.checked || presentRadio.checked) {
        selectionGuidance.textContent = 'Što sada: ' + scoutingGuidanceText(source, presentRadio.checked);
        selectionGuidance.hidden = false;
      } else {
        selectionGuidance.textContent = '';
        selectionGuidance.hidden = true;
      }
      save.disabled = !(noneRadio.checked || (presentRadio.checked && signCount > 0));
    }

    opener.addEventListener('click', function () {
      opener.hidden = true;
      form.hidden = false;
      dateInput.value = localTodayYmd();
      resetObservationPlantScope(plantInputs, plant.plant_id);
      refreshScoutingState();
    });
    cancel.addEventListener('click', function () {
      form.reset();
      dateInput.value = localTodayYmd();
      resetObservationPlantScope(plantInputs, plant.plant_id);
      message.hidden = true;
      form.hidden = true;
      opener.hidden = false;
      refreshScoutingState();
    });
    noneRadio.addEventListener('change', refreshScoutingState);
    presentRadio.addEventListener('change', refreshScoutingState);
    for (var s = 0; s < signInputs.length; s++) signInputs[s].addEventListener('change', refreshScoutingState);

        message: message,
        form: form

  function appendPlantDetailTrapAdvisorySection(parent, plant, result) {
    if (typeof trapCaptureSourcesForSpecies !== 'function') return;
    if (typeof trapAdvisorySourceById !== 'function') return;
    var sources = trapCaptureSourcesForSpecies(plant.species);
    if (!sources.length) return;
    var observations = result && result.store && Array.isArray(result.store.observations) ? result.store.observations : [];
    var todayYmd = localTodayYmd();

    var section = makeEl('section', 'v2-plants-section');
    section.appendChild(makeEl('h3', '', 'Klopke'));
    var list = makeEl('div', 'v2-seasonal-list');
    var anyCard = false;

    for (var i = 0; i < sources.length; i++) {
      var captureSource = sources[i];
      if (isYoungTreeRelevanceMode(plant, todayYmd) && YOUNG_TREE_FRUITING_ONLY_B2_SOURCE_ROWS[captureSource.source_row]) continue;
      var advisory = trapAdvisorySourceById(captureSource.source_entry_id);
      if (!advisory) continue;
      anyCard = true;
      var card = makeEl('article', 'v2-seasonal-card');
      card.appendChild(makeEl('p', 'v2-seasonal-card-title', captureSource.target_label_hr));
      if (advisory.cadence_note) card.appendChild(makeEl('span', 'v2-seasonal-meta', advisory.cadence_note));

      var lastObs = null;
      for (var j = 0; j < observations.length; j++) {
        var obs = observations[j];
        if (!obs || obs.kind !== 'trap') continue;
        if (obs.plant_id !== plant.plant_id) continue;
        if (!obs.payload || obs.payload.source_entry_id !== captureSource.source_entry_id) continue;
        if (typeof obs.observed_on !== 'string') continue;
        if (!lastObs || obs.observed_on > lastObs.observed_on) lastObs = obs;
      }
      if (lastObs) {
        card.appendChild(makeEl('span', 'v2-seasonal-note', 'Zadnji spremljeni zapis: ' + formatDateYmd(lastObs.observed_on)));
      }

      var recent = typeof recentTrapObservationsForPlant === 'function' ? recentTrapObservationsForPlant(observations, plant.plant_id, captureSource.source_entry_id, todayYmd) : [];
      if (recent.length > 0) {
        var total = 0;
        for (var k = 0; k < recent.length; k++) {
          var rc = recent[k];
          if (rc && rc.payload && typeof rc.payload.count === 'number') total += rc.payload.count;
        }
        var bandText = 'Ulov u zadnjih 7 dana: ' + total;
        if (advisory.mode !== 'context_only') {
          var band = typeof resolveTrapAdvisoryBand === 'function' ? resolveTrapAdvisoryBand(advisory, total) : null;
          if (band) bandText += ' — ' + band.label + '; ' + band.body;
        }
        card.appendChild(makeEl('span', 'v2-seasonal-note', bandText));
      }

      if (advisory.mode === 'context_only') {
        card.appendChild(makeEl('span', 'v2-seasonal-meta', (advisory.source_summary_heading_hr || 'Sažetak izvora') + ':'));
        var sourceList = makeEl('ul', 'v2-seasonal-pragovi');
        var summaryLines = Array.isArray(advisory.source_summary_lines_hr) ? advisory.source_summary_lines_hr : [];
        for (var c = 0; c < summaryLines.length; c++) {
          sourceList.appendChild(makeEl('li', '', summaryLines[c]));
        }
        card.appendChild(sourceList);

        card.appendChild(makeEl('span', 'v2-seasonal-meta', contextOnlyTrapOrientation.heading_hr + ':'));
        var orientList = makeEl('ul', 'v2-seasonal-pragovi');
        for (var o = 0; o < contextOnlyTrapOrientation.orientation_items.length; o++) {
          var ob = contextOnlyTrapOrientation.orientation_items[o];
          orientList.appendChild(makeEl('li', '', ob.range_label + ' — ' + ob.body_hr));
        }
        card.appendChild(orientList);
        card.appendChild(makeEl('span', 'v2-seasonal-note', contextOnlyTrapOrientation.footer_hr));
      } else {
        card.appendChild(makeEl('span', 'v2-seasonal-meta', 'Pragovi (informativni):'));
        var pragoviList = makeEl('ul', 'v2-seasonal-pragovi');
        for (var b = 0; b < advisory.bands.length; b++) {
          pragoviList.appendChild(makeEl('li', '', advisory.bands[b].label + ' — ' + advisory.bands[b].body));
        }
        card.appendChild(pragoviList);

        if (advisory.footer) {
          card.appendChild(makeEl('span', 'v2-seasonal-note', advisory.footer));
        }
      }

      list.appendChild(card);
    }

    if (!anyCard) return;
    section.appendChild(list);
    parent.appendChild(section);
  }

  function archiveValidationMessage(error) {
    if (error.indexOf('.archived_at in the future') !== -1) return 'datum arhiviranja ne može biti u budućnosti';
    if (error.indexOf('.archived_at invalid format') !== -1 || error.indexOf('.archived_at not a real date') !== -1) return 'datum arhiviranja nije valjan';
    if (error.indexOf('.archive_reason') !== -1) return 'razlog arhiviranja nije valjan';
    if (error.indexOf('.archive_note') !== -1) return 'bilješka arhiviranja ne može biti prazna i može imati najviše 1000 znakova';
    return error;
  }

  function savePlantArchive(plantId, fields) {
    fields.message.hidden = true;
    var current = readValidStore();
    if (!current.ok) {
      fields.message.textContent = current.error;
      fields.message.hidden = false;
      return;
    }
    var plant = findPlant(current.store.plants, plantId);
    if (!plant) {
      fields.message.textContent = 'Voćka nije pronađena.';
      fields.message.hidden = false;
      return;
    }
    if (isPlantArchived(plant)) {
      fields.message.textContent = 'Voćka je već arhivirana.';
      fields.message.hidden = false;
      return;
    }
    var archiveDate = fields.dateInput.value;
    if (!archiveDate) {
      fields.message.textContent = 'Datum arhiviranja je obavezan.';
      fields.message.hidden = false;
      return;
    }
    if (!parseYmd(archiveDate)) {
      fields.message.textContent = 'Datum arhiviranja nije valjan.';
      fields.message.hidden = false;
      return;
    }
    if (archiveDate > localTodayYmd()) {
      fields.message.textContent = 'Datum ne može biti u budućnosti. Arhiviranje opisuje stvarni događaj.';
      fields.message.hidden = false;
      return;
    }
    var reason = fields.reasonSelect.value;
    if (reason && !ARCHIVE_REASON_LABEL_HR[reason]) {
      fields.message.textContent = 'Razlog arhiviranja nije valjan.';
      fields.message.hidden = false;
      return;
    }
    var note = fields.note.value.trim();
    if (note.length > ARCHIVE_NOTE_MAX_LENGTH) {
      fields.message.textContent = 'Bilješka može imati najviše 1000 znakova.';
      fields.message.hidden = false;
      return;
    }

    var nextPlants = [];
    for (var i = 0; i < current.store.plants.length; i++) {
      var source = current.store.plants[i];
      if (source.plant_id !== plantId) {
        nextPlants.push(source);
        continue;
      }
      var archived = {};
      var keys = Object.keys(source);
      for (var k = 0; k < keys.length; k++) archived[keys[k]] = source[keys[k]];
      archived.archived_at = archiveDate;
      if (reason) archived.archive_reason = reason;
      if (note) archived.archive_note = note;
      nextPlants.push(archived);
    }

    var nextStore = {
      meta: current.store.meta,
      catalogs: current.store.catalogs,
      plants: nextPlants,
      plan_instances: current.store.plan_instances,
      plan_overlays: current.store.plan_overlays,
      activities: current.store.activities,
      observations: current.store.observations,
      corrections: current.store.corrections,
      review_state: current.store.review_state
    };

    var errors = window.v2ValidateForBackup(nextStore);
    if (errors.length > 0) {
      fields.message.textContent = 'Voćka nije arhivirana: ' + archiveValidationMessage(errors[0]) + '.';
      fields.message.hidden = false;
      return;
    }
    try {
      localStorage.setItem('vocnjak_v2', JSON.stringify(nextStore));
    } catch (e) {
      fields.message.textContent = 'Pohranu nije moguće zapisati.';
      fields.message.hidden = false;
      return;
    }
    pendingDetailStatus = 'Voćka arhivirana.';
    render();
  }

  function renderDetail(route) {
    var result = readValidStore();
    if (!result.ok || route.malformed) {
      renderNotFound();
      return;
    }
    var plant = findPlant(result.store.plants, route.plant_id);
    if (!plant) {
      renderNotFound();
      return;
    }

    setViews('detail');
    clearNode(detailView);

    var back = makeEl('button', 'v2-plants-secondary v2-plants-detail-back', '← Natrag na popis');
    back.type = 'button';
    back.addEventListener('click', function () { location.hash = '#v2'; });

    if (pendingDetailStatus) {
      detailView.appendChild(makeEl('p', 'v2-plants-status', pendingDetailStatus));
      pendingDetailStatus = '';
    }
    detailView.appendChild(makeEl('h2', '', plantTitle(plant)));
    var archived = isPlantArchived(plant);
    if (archived) appendArchivedPlantMarker(detailView, plant);

    var section = makeEl('section', 'v2-plants-section');
    section.appendChild(makeEl('h3', '', 'Karton voćke'));
    var karton = makeEl('div', 'v2-plants-karton');
    addKartonRow(karton, 'Vrsta', speciesLabel(plant.species));
    if (plant.species !== 'pomegranate') {
      if (isUnknownTag(plant.variety)) addKartonRow(karton, 'Sorta', 'ne znam');
      else if (typeof plant.variety === 'string') addKartonRow(karton, 'Sorta', varietyLabel(plant.species, plant.variety));
      else addKartonRow(karton, 'Sorta', 'nije upisano');
    }
    if (hasOwnKey(plant, 'ripening_fallback')) addKartonRow(karton, 'Vrijeme dozrijevanja', bandLabel(plant.ripening_fallback));
    addKartonRow(karton, 'Podloga', renderValue(plant.rootstock));
    addKartonRow(karton, 'Posađeno', renderValue(plant.planted_at, 'date'));
    addKartonRow(karton, 'Kupljeno', renderValue(plant.purchased_at, 'date'));
    addKartonRow(karton, 'Izvor', renderValue(plant.source_label));
    addKartonRow(karton, 'Položaj', renderValue(plant.position_label));
    addKartonRow(karton, 'Bilješka', renderValue(plant.profile_note));
    addKartonRow(karton, 'Korisnička oznaka', renderValue(plant.display_label));
    section.appendChild(karton);
    detailView.appendChild(section);

    var todayYmd = localTodayYmd();
    if (!archived) {
      appendArchiveSection(detailView, plant);
      appendYoungTreePlantDetailSection(detailView, plant, todayYmd);

      try {
        var snapshot = buildSeasonalSnapshot(result.store, result.catalog, todayYmd);
        var currentActions = currentPlantSeasonalOccurrences(snapshot, plant.plant_id, result.catalog).filter(function (occurrence) {
          return occurrenceVisibleForYoungTreeRelevance(occurrence, snapshot.today);
        });
        if (currentActions.length > 0) {
          var seasonal = makeEl('section', 'v2-plants-section');
          seasonal.appendChild(makeEl('h3', '', 'Trenutne sezonske radnje'));
          var seasonalList = makeEl('div', 'v2-seasonal-list');
          for (var i = 0; i < currentActions.length; i++) {
            appendPlantSeasonalActionCard(seasonalList, currentActions[i], result.catalog, snapshot);
          }
          seasonal.appendChild(seasonalList);
          detailView.appendChild(seasonal);
        }
      } catch (e) {
        renderSeasonalSnapshotFailure(detailView, e);
      }

      var activePlantList = activePlants(result.store.plants);
      var b2Preview = typeof b2PlantDetailPreview === 'function' ? b2PlantDetailPreview(plant) : { monitoring: [], riskAwareness: [] };
      b2Preview = filterB2PlantDetailPreviewForYoungTree(plant, b2Preview, todayYmd);
      appendPlantDetailB2Section(detailView, 'Praćenje', b2Preview.monitoring, plant, activePlantList);
      appendPlantDetailB2Section(detailView, 'Sezonske napomene', b2Preview.riskAwareness, plant, activePlantList);
      appendNoteObservationCaptureSection(detailView, plant, activePlantList);
      appendPlantDetailTrapAdvisorySection(detailView, plant, result);

    var diary = makeEl('section', 'v2-plants-section');
    diary.appendChild(makeEl('h3', '', 'Dnevnik ove voćke'));

    if (plantDiaryItems.length === 0) {

    } else {
      var preview = makeEl('div', 'v2-diary-list');
      appendDiaryItems(preview, plantDiaryItems, result, { showCorrectionActions: false, showObservationCorrectionActions: true });
      diary.appendChild(preview);
    }
    var fullDiary = makeEl('button', 'v2-plants-secondary', 'Prikaži cijeli dnevnik voćke');
    fullDiary.type = 'button';
    fullDiary.addEventListener('click', function () { location.hash = plantDiaryRoute(plant.plant_id); });
    diary.appendChild(fullDiary);
    detailView.appendChild(diary);
  }

  function appendUnknownableField(parent, id, labelText, type) {
    var input = type === 'textarea' ? document.createElement('textarea') : document.createElement('input');
    if (type !== 'textarea') input.type = type;
    var wrap = appendField(parent, id, labelText, input);
    var checkLabel = makeEl('label', 'v2-plants-check');

  function optionalString(input) {

  function addStringOrUnknown(candidate, key, field) {
    if (field.unknown.checked) {
      candidate[key] = { unknown: true };
      return;
    }
    var value = optionalString(field.input);
    if (value) candidate[key] = value;
  }

  function addDateOrUnknown(candidate, key, field) {
    if (field.unknown.checked) {
      candidate[key] = { unknown: true };
      return;
    }
    if (field.input.value) candidate[key] = field.input.value;
  }

  function generatePlantId() {
    var iso = new Date().toISOString();
    var safe = iso.replace(/[:.]/g, '-');
    var rand;
    if (window.crypto && window.crypto.getRandomValues) {
      var buf = new Uint8Array(3);
      window.crypto.getRandomValues(buf);
      rand = Array.prototype.map.call(buf, function (b) {
        return ('0' + b.toString(16)).slice(-2);
      }).join('').slice(0, 5);
    } else {
      rand = Math.floor(Math.random() * 0x100000).toString(16);
      while (rand.length < 5) rand = '0' + rand;
      rand = rand.slice(0, 5);
    }
    return 'plant_' + safe + '_' + rand;
  }

  function nextPlantId(plants) {
    for (var attempt = 0; attempt < 2; attempt++) {
      var id = generatePlantId();
      if (!findPlant(plants, id)) return id;
    }
    return null;
  }

  function randomHex(length) {
    var out = '';
    if (window.crypto && window.crypto.getRandomValues) {
      var buf = new Uint8Array(Math.ceil(length / 2));
      window.crypto.getRandomValues(buf);
      out = Array.prototype.map.call(buf, function (b) {
        return ('0' + b.toString(16)).slice(-2);
      }).join('');
    } else {
      while (out.length < length) out += Math.floor(Math.random() * 0x100000).toString(16);
    }
    return out.slice(0, length);
  }

  function generateStoreId(prefix) {
    var safe = new Date().toISOString().replace(/[:.]/g, '-');
    return prefix + '_' + safe + '_' + randomHex(5);
  }

  function nextUniqueId(prefix, records, key) {
    for (var attempt = 0; attempt < 4; attempt++) {
      var id = generateStoreId(prefix);
      var exists = false;
      for (var i = 0; i < records.length; i++) {
        if (records[i][key] === id) {
          exists = true;
          break;
        }
      }
      if (!exists) return id;
    }
    return null;
  }

  function maxStableOrder(plants) {
    var max = 0;
    for (var i = 0; i < plants.length; i++) {
      if (plants[i].stable_order > max) max = plants[i].stable_order;
    }
    return max;
  }

  function buildCandidate(fields, plants) {
    var species = fields.speciesSelect.value;
    if (!species) return { ok: false, error: 'Vrsta je obavezna.' };
    if (!hasOwnKey(fields.catalog.species, species)) return { ok: false, error: 'Odabrana vrsta nije u katalogu.' };

    var id = nextPlantId(plants);
    if (!id) return { ok: false, error: 'Greška pri generaciji identifikatora.' };

    var candidate = {
      plant_id: id,
      catalog_version: 'catalog_v1',
      stable_order: maxStableOrder(plants) + 1000,
      species: species
    };

    if (!fields.varietyWrap.hidden) {
      if (fields.varietySelect.value === UNKNOWN_SELECT_VALUE) candidate.variety = { unknown: true };
      else if (fields.varietySelect.value) candidate.variety = fields.varietySelect.value;
    }

    if (!fields.fallbackWrap.hidden) {
      if (fields.fallbackSelect.value === UNKNOWN_SELECT_VALUE) candidate.ripening_fallback = { unknown: true };
      else if (fields.fallbackSelect.value) candidate.ripening_fallback = fields.fallbackSelect.value;
    }

    addStringOrUnknown(candidate, 'rootstock', fields.rootstock);
    addDateOrUnknown(candidate, 'planted_at', fields.plantedAt);
    addDateOrUnknown(candidate, 'purchased_at', fields.purchasedAt);
    addStringOrUnknown(candidate, 'source_label', fields.sourceLabel);
    addStringOrUnknown(candidate, 'position_label', fields.positionLabel);

    var note = optionalString(fields.note);
    if (note) candidate.profile_note = note;
    var display = optionalString(fields.displayLabel);
    if (display) candidate.display_label = display;

    return { ok: true, plant: candidate };
  }

  function addPlantValidationMessage(error) {
    if (/^plant\.plant_[^.]+\.planted_at in the future$/.test(error)) return 'datum sadnje ne može biti u budućnosti';
    if (/^plant\.plant_[^.]+\.purchased_at in the future$/.test(error)) return 'datum kupnje ne može biti u budućnosti';
    return error;
  }

    };

  function buildNoteObservations(current, fields) {
    if (!fields.dateInput.value) return { ok: false, error: 'Datum opažanja je obavezan.' };
    if (fields.dateInput.value > localTodayYmd()) return { ok: false, error: 'Datum ne može biti u budućnosti.' };
    var text = fields.text.value.trim();
    if (!text) return { ok: false, error: 'Tekst opažanja je obavezan.' };
    if (text.length > 1000) return { ok: false, error: 'Tekst opažanja može imati najviše 1000 znakova.' };
    var selected = selectedObservationPlantIds(fields.plantInputs || []);
    if (selected.length === 0) return { ok: false, error: 'Odaberi barem jednu voćku.' };
    var recordedAt = new Date().toISOString();
    var groupId = selected.length > 1 ? generateStoreId('observation_group') : null;
    var observations = [];
    for (var i = 0; i < selected.length; i++) {
      var plant = findPlant(current.store.plants, selected[i]);
      if (!plant) return { ok: false, error: 'Voćka nije pronađena.' };
      if (isPlantArchived(plant)) return { ok: false, error: 'Arhivirana voćka nije aktivna za novo opažanje.' };
      var observationId = nextUniqueId('observation', current.store.observations.concat(observations), 'observation_id');
      if (!observationId) return { ok: false, error: 'Greška pri generaciji identifikatora.' };
      var observation = {
        observation_id: observationId,
        plant_id: plant.plant_id,
        catalog_version: current.store.meta.active_catalog_version,
        kind: 'note',
        observed_on: fields.dateInput.value,
        recorded_at: recordedAt,
        payload: { text: text },
        program_id: null,
        provenance: { source: 'user' }
      };
      if (groupId) observation.observation_group_id = groupId;
      observations.push(observation);
    }
    return {
      ok: true,
      observations: observations
    };
  }

    var nextStore = noteObservationStoreCandidate(current, current.store.observations.concat(built.observations));
    var errors = window.v2ValidateForBackup(nextStore);
    if (errors.length > 0) {
      fields.message.textContent = 'Opažanje nije spremljeno: ' + noteObservationValidationMessage(errors[0]) + '.';
      fields.message.hidden = false;
      return;
    }

      localStorage.setItem('vocnjak_v2', JSON.stringify(nextStore));
    } catch (e) {
      fields.message.textContent = 'Pohranu nije moguće zapisati.';
      fields.message.hidden = false;
      return;
    }
    fields.form.reset();
    pendingDetailStatus = built.observations.length > 1 ? 'Opažanje spremljeno za ' + plantCountText(built.observations.length) + '.' : 'Opažanje spremljeno.';
    if (location.hash === plantDetailRoute(plantId)) render();
    else location.hash = plantDetailRoute(plantId);
  }

  function buildTrapObservation(current, plantId, fields) {
    var plant = findPlant(current.store.plants, plantId);
    if (!plant) return { ok: false, error: 'Voćka nije pronađena.' };
    if (isPlantArchived(plant)) return { ok: false, error: 'Arhivirana voćka nije aktivna za novo opažanje.' };
    if (!fields.dateInput.value) return { ok: false, error: 'Datum opažanja je obavezan.' };
    if (fields.dateInput.value > localTodayYmd()) return { ok: false, error: 'Datum ne može biti u budućnosti.' };
    var source = typeof trapCaptureSourceById === 'function' ? trapCaptureSourceById(fields.sourceSelect.value) : null;
    if (!source || source.species !== plant.species) return { ok: false, error: 'Odabrana klopka nije valjana za ovu voćku.' };
    var count;
    if (fields.zeroRadio.checked) {
      count = 0;
    } else if (fields.countRadio.checked) {
      if (!/^[0-9]+$/.test(fields.countInput.value)) return { ok: false, error: 'Broj ulova mora biti cijeli broj 0 ili veći.' };
      count = Number(fields.countInput.value);
    } else {
      return { ok: false, error: 'Odaberi Bez ulova ili upiši broj ulova.' };
    }
    var observationId = nextUniqueId('observation', current.store.observations, 'observation_id');
    if (!observationId) return { ok: false, error: 'Greška pri generaciji identifikatora.' };
    return {
      ok: true,
      observation: {
        observation_id: observationId,
        plant_id: plant.plant_id,
        catalog_version: current.store.meta.active_catalog_version,
        kind: 'trap',
        observed_on: fields.dateInput.value,
        recorded_at: new Date().toISOString(),
        payload: {
          source_entry_id: source.source_entry_id,
          target_pest_code: source.local_trap_target_code,
          count: count
        },
        program_id: null,
        provenance: { source: 'user' }
      }
    };
  }

  function buildScoutingObservations(current, fields) {
    if (!fields.dateInput.value) return { ok: false, error: 'Datum opažanja je obavezan.' };
    if (fields.dateInput.value > localTodayYmd()) return { ok: false, error: 'Datum ne može biti u budućnosti.' };
    var source = typeof scoutingCaptureSourceById === 'function' ? scoutingCaptureSourceById(fields.sourceEntryId) : null;
    if (!source) return { ok: false, error: 'Odabrani vizualni pregled nije valjan.' };
    var findingValue;
    if (fields.noneRadio.checked) findingValue = false;
    else if (fields.presentRadio.checked) findingValue = true;
    else return { ok: false, error: 'Odaberi rezultat vizualnog pregleda.' };
    var selectedSigns = findingValue ? selectedScoutingSignKeys(fields.signInputs || []) : [];
    if (findingValue && selectedSigns.length === 0) return { ok: false, error: 'Odaberi barem jedan vidljivi znak.' };
    var note = fields.note.value.trim();
    if (note.length > 1000) return { ok: false, error: 'Bilješka može imati najviše 1000 znakova.' };
    var selected = selectedObservationPlantIds(fields.plantInputs || []);
    if (selected.length === 0) return { ok: false, error: 'Odaberi barem jednu voćku.' };
    var recordedAt = new Date().toISOString();
    var groupId = selected.length > 1 ? generateStoreId('observation_group') : null;
    var observations = [];
    var payload = {
      source_entry_id: source.source_entry_id,
      target_code: source.local_scouting_target_code,
      finding: {
        mode: 'presence',
        value: findingValue
      },
      selected_sign_keys: selectedSigns.slice()
    };
    if (note) payload.note = note;
    for (var i = 0; i < selected.length; i++) {
      var plant = findPlant(current.store.plants, selected[i]);
      if (!plant) return { ok: false, error: 'Voćka nije pronađena.' };
      if (isPlantArchived(plant)) return { ok: false, error: 'Arhivirana voćka nije aktivna za novo opažanje.' };
      if (!plantEligibleForScoutingSource(plant, source, localTodayYmd())) return { ok: false, error: 'Odabrani vizualni pregled nije valjan za ovu voćku.' };
      var observationId = nextUniqueId('observation', current.store.observations.concat(observations), 'observation_id');
      if (!observationId) return { ok: false, error: 'Greška pri generaciji identifikatora.' };
      var observation = {
        observation_id: observationId,
        plant_id: plant.plant_id,
        catalog_version: current.store.meta.active_catalog_version,
        kind: 'scouting',
        observed_on: fields.dateInput.value,
        recorded_at: recordedAt,
        payload: {
          source_entry_id: payload.source_entry_id,
          target_code: payload.target_code,
          finding: {

          },
          selected_sign_keys: payload.selected_sign_keys.slice()
        },
        program_id: null,
        provenance: { source: 'user' }
      };
      if (hasOwnKey(payload, 'note')) observation.payload.note = payload.note;
      if (groupId) observation.observation_group_id = groupId;
      observations.push(observation);
    }
    return {
      ok: true,
      observations: observations
    };

  function copyActivity(activity) {
    var out = {
      activity_id: activity.activity_id,
      plant_id: activity.plant_id,
      window_def_id: activity.window_def_id,
      catalog_version: activity.catalog_version,
      action_type: activity.action_type,
      status: activity.status,
      occurred_on: activity.occurred_on,
      recorded_at: activity.recorded_at,
      provenance: activity.provenance
    };
    if (hasOwnKey(activity, 'activity_group_id')) out.activity_group_id = activity.activity_group_id;
    if (hasOwnKey(activity, 'notes')) out.notes = activity.notes;
    return out;
  }

  function applyCorrections(activity, corrections) {
    var effective = copyActivity(activity);
    var sorted = corrections.slice().sort(activityHelpers.correctionSort);
    for (var i = 0; i < sorted.length; i++) {
      var correction = sorted[i];
      var cv = correction.corrected_values;
      if (correction.correction_types.indexOf('date') !== -1) effective.occurred_on = cv.occurred_on;
      if (correction.correction_types.indexOf('plant') !== -1) effective.plant_id = cv.plant_id;
      if (correction.correction_types.indexOf('window') !== -1) {
        effective.window_def_id = cv.window_def_id;
        effective.catalog_version = cv.catalog_version;
        effective.action_type = cv.action_type;
      }
      if (correction.correction_types.indexOf('status') !== -1) effective.status = cv.status;
      if (correction.correction_types.indexOf('notes') !== -1) effective.notes = cv.notes;
    }
    return effective;
  }

  function activityValue(record, key) {
    return hasOwnKey(record, key) ? record[key] : undefined;
  }

  function activityChanged(original, effective) {
    var keys = ['plant_id','window_def_id','catalog_version','action_type','status','occurred_on','notes'];
    for (var i = 0; i < keys.length; i++) {
      if (activityValue(original, keys[i]) !== activityValue(effective, keys[i])) return true;
    }
    return false;
  }

  function effectiveActivityEntries(store, catalog) {
    var byActivity = Object.create(null);
    for (var c = 0; c < store.corrections.length; c++) {
      var correction = store.corrections[c];
      if (!byActivity[correction.original_record_id]) byActivity[correction.original_record_id] = [];
      byActivity[correction.original_record_id].push(correction);
    }
    var entries = [];
    for (var i = 0; i < store.activities.length; i++) {
      var corrections = byActivity[store.activities[i].activity_id] || [];
      var effective = applyCorrections(store.activities[i], corrections);
      entries.push({
        original: store.activities[i],
        effective: effective,
        corrections: corrections.slice().sort(activityHelpers.correctionSort),
        corrected: activityChanged(store.activities[i], effective)
      });
    }
    return entries;
  }

  function isSupportedObservationKind(kind) {
    return kind === 'note' || kind === 'trap' || kind === 'stage_obs' || kind === 'scouting';
  }

  function effectiveObservationEntries(store) {
    var byObservation = Object.create(null);
    for (var c = 0; c < store.corrections.length; c++) {
      var correction = store.corrections[c];
      if (correction.original_record_type !== 'observation') continue;
      if (!byObservation[correction.original_record_id]) byObservation[correction.original_record_id] = [];
      byObservation[correction.original_record_id].push(correction);
    }
    var entries = [];
    for (var i = 0; i < store.observations.length; i++) {
      if (!isSupportedObservationKind(store.observations[i].kind)) continue;
      var corrections = byObservation[store.observations[i].observation_id] || [];
      var effective = observationHelpers.composeEffectiveObservation(store.observations[i], corrections);
      entries.push({
        original: store.observations[i],
        effective: effective,
        corrections: corrections.slice().sort(observationHelpers.correctionSort),
        corrected: corrections.length > 0
      });
    }
    return entries;
  }

  function findEffectiveObservationEntry(entries, observationId) {
    for (var i = 0; i < entries.length; i++) {
      if (entries[i].original.observation_id === observationId) return entries[i];
    }
    return null;
  }

  function findEffectiveObservationGroup(entries, groupId) {
    var group = [];
    for (var i = 0; i < entries.length; i++) {
      if (hasOwnKey(entries[i].original, 'observation_group_id') && entries[i].original.observation_group_id === groupId) {
        group.push(entries[i]);
      }
    }
    group.sort(function (a, b) {
      return a.original.observation_id.localeCompare(b.original.observation_id);
    });
    return group;
  }

  function groupedObservationCorrectionAvailable(entries) {
    if (!entries || entries.length < 2) return false;
    var kind = entries[0].original.kind;
    if (kind !== 'note' && kind !== 'stage_obs' && kind !== 'scouting') return false;
    for (var i = 0; i < entries.length; i++) {
      if (entries[i].original.kind !== kind) return false;
    }
    return true;
  }

  function seasonalSnapshotError(details) {
    var err = new Error(SEASONAL_SNAPSHOT_ERROR_TEXT);
    err.seasonalDetails = details;
    return err;
  }

  function assertSeasonalCatalog(catalog) {
    var details = [];
    if (!isPlainObject(catalog) || !Array.isArray(catalog.action_window_definitions)) {
      details.push('catalog.action_window_definitions missing');
    } else {
      for (var i = 0; i < catalog.action_window_definitions.length; i++) {
        var def = catalog.action_window_definitions[i];
        var path = 'catalog.action_window_definitions[' + i + ']';
        if (!isPlainObject(def)) {
          details.push(path + ' not an object');
          continue;
        }
        if (hasOwnKey(DEFERRED_SEASONAL_ACTION_TYPES, def.action_type)) {
          details.push(path + ' deferred action_type: ' + def.action_type);
        }
        if (def.label === 'Sezonsko navodnjavanje') {
          details.push(path + ' seasonal watering is not an action window');
        }
        if (!isPlainObject(def.anchor) || def.anchor.kind !== 'calendar') {
          details.push(path + ' non-calendar anchor');
          continue;
        }
        if (!isPlainObject(def.anchor.month_day_open) || !isPlainObject(def.anchor.month_day_close)) {
          details.push(path + ' missing calendar bounds');
          continue;
        }
        if (monthDayOrdinal(def.anchor.month_day_close) < monthDayOrdinal(def.anchor.month_day_open)) {
          details.push(path + ' cross-year window: ' + def.window_def_id);
        }
      }
    }
    if (details.length > 0) throw seasonalSnapshotError(details);
  }

  function seasonalWindowDates(def, year) {
    var before = def.tolerance && def.tolerance.before ? def.tolerance.before.value : 0;
    var after = def.tolerance && def.tolerance.after ? def.tolerance.after.value : 0;
    var open = addDaysYmd(ymdFromMonthDay(year, def.anchor.month_day_open), -before);
    var close = addDaysYmd(ymdFromMonthDay(year, def.anchor.month_day_close), after);
    var nextOpen = addDaysYmd(ymdFromMonthDay(year + 1, def.anchor.month_day_open), -before);
    return { effective_open: open, effective_close: close, next_effective_open: nextOpen };
  }

  function entrySort(a, b) {
    var ae = a.effective;
    var be = b.effective;
    if (ae.occurred_on !== be.occurred_on) return ae.occurred_on.localeCompare(be.occurred_on);
    if (ae.recorded_at !== be.recorded_at) return ae.recorded_at.localeCompare(be.recorded_at);
    return ae.activity_id.localeCompare(be.activity_id);
  }

  function findOccurrenceEvidence(entries, occurrence) {
    var matches = [];
    for (var i = 0; i < entries.length; i++) {
      var effective = entries[i].effective;
      if (effective.plant_id !== occurrence.plant_id) continue;
      if (effective.window_def_id !== occurrence.window_def_id) continue;
      if (effective.catalog_version !== occurrence.catalog_version) continue;
      if (effective.occurred_on < occurrence.effective_open) continue;
      if (effective.occurred_on >= occurrence.next_effective_open) continue;
      matches.push(entries[i]);
    }
    matches.sort(entrySort);
    var firstDoneLate = null;
    var firstSkipped = null;
    for (var m = 0; m < matches.length; m++) {
      var e = matches[m].effective;
      if (e.status === 'done' && e.occurred_on <= occurrence.effective_close) {
        return { status: 'done', entry: matches[m], occurred_on: e.occurred_on };
      }
      if (e.status === 'done' && e.occurred_on > occurrence.effective_close && !firstDoneLate) {
        firstDoneLate = { status: 'done_late', entry: matches[m], occurred_on: e.occurred_on };
      }
      if (e.status === 'skipped' && !firstSkipped) {
        firstSkipped = { status: 'skipped', entry: matches[m], occurred_on: e.occurred_on };
      }
    }
    return firstDoneLate || firstSkipped;
  }

  function deriveOccurrenceState(today, occurrence, evidence) {
    if (evidence) return evidence.status;
    if (today < occurrence.effective_open) return 'upcoming';
    if (today > occurrence.effective_close) return 'missed';
    if (daysBetweenYmd(today, occurrence.effective_close) < CLOSING_SOON_THRESHOLD_DAYS) return 'closing-soon';
    return 'open';
  }

  function buildSeasonalSnapshot(store, catalog, today) {
    assertSeasonalCatalog(catalog);
    var todayYear = Number(today.slice(0, 4));
    if (!todayYear || String(todayYear).length !== 4) throw seasonalSnapshotError(['today invalid: ' + today]);
    var plants = activePlants(store.plants).sort(function (a, b) { return a.stable_order - b.stable_order; });
    var entries = effectiveActivityEntries(store, catalog);
    var occurrences = [];
    for (var d = 0; d < catalog.action_window_definitions.length; d++) {
      var def = catalog.action_window_definitions[d];
      var dates = seasonalWindowDates(def, todayYear);
      for (var p = 0; p < plants.length; p++) {
        var plant = plants[p];
        if (!activityHelpers.isWindowApplicableToPlant(def, plant, catalog)) continue;
        var occurrence = {
          occurrence_id: plant.plant_id + '|' + def.window_def_id + '|' + todayYear,
          plant_id: plant.plant_id,
          plant: plant,
          def: def,
          window_def_id: def.window_def_id,
          catalog_version: def.catalog_id,
          action_type: def.action_type,
          cycle_year: todayYear,
          effective_open: dates.effective_open,
          effective_close: dates.effective_close,
          next_effective_open: dates.next_effective_open,
          gate_state: 'ne primjenjuje se'
        };
        occurrence.evidence = findOccurrenceEvidence(entries, occurrence);
        occurrence.state = deriveOccurrenceState(today, occurrence, occurrence.evidence);
        occurrences.push(occurrence);
      }
    }
    return {
      today: today,
      cycle_year: todayYear,
      occurrences: occurrences,
      groups: groupSeasonalOccurrences(occurrences, catalog),
      monitoring: [],
      cues: []
    };
  }

  function groupSeasonalOccurrences(occurrences, catalog) {
    var byKey = Object.create(null);
    for (var i = 0; i < occurrences.length; i++) {
      var o = occurrences[i];
      var key = [
        o.catalog_version,
        o.window_def_id,
        o.cycle_year,
        o.effective_open,
        o.effective_close
      ].join('|');
      if (!byKey[key]) {
        byKey[key] = {
          key: key,
          def: o.def,
          catalog: catalog,
          window_def_id: o.window_def_id,
          catalog_version: o.catalog_version,
          cycle_year: o.cycle_year,
          effective_open: o.effective_open,
          effective_close: o.effective_close,
          occurrences: []
        };
      }
      byKey[key].occurrences.push(o);
    }
    var groups = Object.keys(byKey).map(function (key) { return byKey[key]; });
    groups.sort(function (a, b) {
      if (a.effective_open !== b.effective_open) return a.effective_open.localeCompare(b.effective_open);
      return actionWindowLabel(a.def, catalog).localeCompare(actionWindowLabel(b.def, catalog), 'hr');
    });
    return groups;
  }

  function groupStats(group) {
    var stats = {
      total: group.occurrences.length,
      upcoming: 0,
      open: 0,
      closingSoon: 0,
      missed: 0,
      done: 0,
      doneLate: 0,
      skipped: 0
    };
    for (var i = 0; i < group.occurrences.length; i++) {
      var state = group.occurrences[i].state;
      if (state === 'upcoming') stats.upcoming += 1;
      else if (state === 'open') stats.open += 1;
      else if (state === 'closing-soon') stats.closingSoon += 1;
      else if (state === 'missed') stats.missed += 1;
      else if (state === 'done') stats.done += 1;
      else if (state === 'done_late') stats.doneLate += 1;
      else if (state === 'skipped') stats.skipped += 1;
    }
    stats.evidenced = stats.done + stats.doneLate + stats.skipped;
    stats.noEvidence = stats.total - stats.evidenced;
    return stats;
  }

  function groupHasLiveState(group) {
    var stats = groupStats(group);
    return stats.open > 0 || stats.closingSoon > 0;
  }

  function groupHasMissedState(group) {
    return groupStats(group).missed > 0;
  }

  function groupHasUpcomingState(group) {
    return groupStats(group).upcoming > 0;
  }

  function upcomingGroupsForPregled(snapshot) {
    var groups = snapshot.groups.filter(groupHasUpcomingState);
    var soon = groups.filter(function (group) {
      return daysBetweenYmd(snapshot.today, group.effective_open) <= 45;
    });
    return soon.length > 0 ? soon : groups.slice(0, 5);
  }

  function countCurrentGroups(groups) {
    return groups.filter(groupHasLiveState).length;
  }

  function countClosingSoonGroups(groups) {
    return groups.filter(function (group) { return groupStats(group).closingSoon > 0; }).length;
  }

  function seasonalStatusSentence(snapshot, groups) {
    var displayGroups = Array.isArray(groups) ? groups : snapshot.groups;
    var current = countCurrentGroups(displayGroups);
    var closing = countClosingSoonGroups(displayGroups);
    if (current === 0) return 'Trenutno nema aktualnih sezonskih radnji.';
    var text = current === 1 ? 'Trenutno je aktualna 1 sezonska radnja.' : 'Trenutno su aktualne ' + current + ' sezonske radnje.';
    if (closing === 1) text += ' Jedna je pri kraju.';
    else if (closing > 1) text += ' ' + closing + ' su pri kraju.';
    return text;
  }

  function evidenceFraction(count, total) {
    if (count === total) return plantCountText(count);
    return count + '/' + total + ' voćki';
  }

  function doneLateText(count) {
    if (count === 1) return '1 evidencija je nakon razdoblja.';
    return count + ' evidencije su nakon razdoblja.';
  }

  function evidenceLines(group, context) {
    var stats = groupStats(group);
    var lines = [];
    if (stats.evidenced > 0) {
      if (stats.skipped === stats.evidenced) lines.push('Preskočeno za ' + evidenceFraction(stats.skipped, stats.total) + '.');
      else lines.push('Evidentirano za ' + evidenceFraction(stats.evidenced, stats.total) + '.');
    }
    if (stats.noEvidence > 0 && (context === 'missed' || stats.missed > 0)) {
      lines.push('Nema evidencije za ' + plantCountText(stats.noEvidence) + '.');
    }
    if (stats.doneLate > 0) lines.push(doneLateText(stats.doneLate));
    return lines;
  }

  function purposeCue(def) {
    if (!def || typeof def.label !== 'string') return '';
    if (def.action_type === 'oil') return 'Namjena: zimska i rana proljetna zaštita.';
    if (def.action_type === 'copper') return 'Namjena: preventivna zaštita.';
    if (def.action_type === 'fungicide') return 'Namjena: zaštita u osjetljivom razdoblju.';
    if (def.action_type === 'pruning') return 'Namjena: oblikovanje i prozračnost krošnje.';
    if (def.action_type === 'fertilization') return 'Namjena: podrška rastu u sezoni.';
    if (def.action_type === 'harvest') return 'Namjena: berba kad plodovi dosegnu zrelost.';
    if (def.label.indexOf('Mreža') !== -1) return 'Namjena: zaštita plodova.';
    if (def.label.indexOf('Krečenje') !== -1) return 'Namjena: zaštita debla.';
    if (def.label.indexOf('Prorjeđivanje') !== -1 || def.label.indexOf('opterećenja') !== -1) return 'Namjena: uravnoteženje roda.';
    if (def.label.indexOf('Pregled za zimu') !== -1) return 'Namjena: provjera debla, vezica, zaštite od glodavaca i mumificiranih plodova.';
    if (def.label.indexOf('Gašenje navodnjavanja') !== -1) return 'Namjena: prilagodba zalijevanja sezoni.';
    return '';
  }

  function groupDateLine(group, context) {
    var stats = groupStats(group);
    if (context === 'current') {
      if (stats.closingSoon > 0) return 'Aktualno do ' + formatDateYmd(group.effective_close) + ' - pri kraju.';
      return 'Aktualno: ' + formatDateRange(group.effective_open, group.effective_close);
    }
    if (context === 'upcoming') return 'Počinje ' + formatDateYmd(group.effective_open);
    if (context === 'missed') return 'Bilo je aktualno: ' + formatDateRange(group.effective_open, group.effective_close);
    if (stats.open > 0 || stats.closingSoon > 0) return groupDateLine(group, 'current');
    if (stats.upcoming > 0) return groupDateLine(group, 'upcoming');
    return groupDateLine(group, 'missed');
  }

  function groupStatusLabel(group, context) {
    var stats = groupStats(group);
    if (context === 'current') return stats.closingSoon > 0 ? 'Pri kraju' : 'Aktualno';
    if (context === 'upcoming') return 'Uskoro';
    if (context === 'missed') return '';
    if (stats.open > 0 || stats.closingSoon > 0) return stats.closingSoon > 0 ? 'Pri kraju' : 'Aktualno';
    if (stats.upcoming > 0) return 'Uskoro';
    return '';
  }

  function pregledStatusChipVariant(label) {
    if (label === 'Aktualno') return 'aktualno';
    if (label === 'Pri kraju') return 'pri-kraju';
    if (label === 'Uskoro') return 'uskoro';
    return 'neutral';
  }

  function plantOccurrenceIsCurrent(snapshot, occurrence) {
    return occurrence.effective_open <= snapshot.today && occurrence.effective_close >= snapshot.today;
  }

  function plantOccurrenceIsRelevantForDetail(snapshot, occurrence) {
    if (occurrence.state === 'open' || occurrence.state === 'closing-soon') return true;
    if (occurrence.state === 'missed') return daysBetweenYmd(occurrence.effective_close, snapshot.today) <= PLANT_DETAIL_RECENT_DAYS;
    if (occurrence.state === 'done') {
      if (plantOccurrenceIsCurrent(snapshot, occurrence)) return true;
      if (occurrence.evidence && daysBetweenYmd(occurrence.evidence.occurred_on, snapshot.today) <= PLANT_DETAIL_RECENT_DAYS) return true;
      return daysBetweenYmd(occurrence.effective_close, snapshot.today) <= PLANT_DETAIL_RECENT_DAYS;
    }
    return false;
  }

  function plantOccurrenceRelevanceRank(snapshot, occurrence) {
    if (plantOccurrenceIsCurrent(snapshot, occurrence)) return 0;
    if (occurrence.state === 'missed') return 1;
    if (occurrence.state === 'done') return 2;
    return 3;
  }

  function currentPlantSeasonalOccurrences(snapshot, plantId, catalog) {
    var occurrences = snapshot.occurrences.filter(function (occurrence) {
      return occurrence.plant_id === plantId && plantOccurrenceIsRelevantForDetail(snapshot, occurrence);
    });
    occurrences.sort(function (a, b) {
      var rankA = plantOccurrenceRelevanceRank(snapshot, a);
      var rankB = plantOccurrenceRelevanceRank(snapshot, b);
      if (rankA !== rankB) return rankA - rankB;
      if (a.effective_close !== b.effective_close) {
        if (rankA === 0) return a.effective_close.localeCompare(b.effective_close);
        return b.effective_close.localeCompare(a.effective_close);
      }
      if (a.effective_open !== b.effective_open) return a.effective_open.localeCompare(b.effective_open);
      return actionWindowLabel(a.def, catalog).localeCompare(actionWindowLabel(b.def, catalog), 'hr');
    });
    return occurrences;
  }

  function plantOccurrenceStatusLabel(occurrence) {
    if (occurrence.state === 'open') return 'Aktualno';
    if (occurrence.state === 'closing-soon') return 'Pri kraju';
    if (occurrence.state === 'upcoming') return 'Uskoro';
    if (occurrence.state === 'missed') return 'Prošlo';
    if (occurrence.state === 'done') return 'Napravljeno';
    if (occurrence.state === 'done_late') return 'Napravljeno nakon razdoblja';
    if (occurrence.state === 'skipped') return 'Preskočeno';
    return '';
  }

  function plantOccurrenceDateLine(occurrence, snapshot) {
    if (occurrence.state === 'closing-soon') return 'Aktualno do ' + formatDateYmd(occurrence.effective_close) + ' - pri kraju.';
    if (snapshot && plantOccurrenceIsCurrent(snapshot, occurrence)) return 'Aktualno od ' + formatDateYmd(occurrence.effective_open) + ' do ' + formatDateYmd(occurrence.effective_close);
    if (occurrence.state === 'missed' || occurrence.state === 'done') return 'Bilo je aktualno od ' + formatDateYmd(occurrence.effective_open) + ' do ' + formatDateYmd(occurrence.effective_close);
    return formatDateRange(occurrence.effective_open, occurrence.effective_close);
  }

  function plantOccurrenceEvidenceLine(occurrence) {
    if (!occurrence.evidence) return 'Nije evidentirano.';
    var dateText = formatDateYmd(occurrence.evidence.occurred_on);
    if (occurrence.evidence.status === 'skipped') return 'Preskočeno ' + dateText;
    if (occurrence.evidence.status === 'done_late') return 'Napravljeno ' + dateText + ' nakon razdoblja.';
    return 'Napravljeno ' + dateText;
  }

  function b2VisibilityForPlants(plants, today) {

  function b2UniquePlantCount(groups) {

        var plantId = groups[i].plants[p].plant_id;
        if (seen[plantId]) continue;
        seen[plantId] = true;
        count += 1;
      }

    return count;
  }

  function b2GroupSpeciesQualifier(group) {

  }

  function findSeasonalGroup(snapshot, route) {
    if (!Number.isInteger(route.cycle_year)) return null;
    for (var i = 0; i < snapshot.groups.length; i++) {
      var group = snapshot.groups[i];
      if (group.catalog_version === route.catalog_version &&
          group.window_def_id === route.window_def_id &&
          group.cycle_year === route.cycle_year) {
        return group;
      }
    }
    return null;
  }

  function seasonalActionIdentityLine(group) {
    return group.catalog_version + ' · ' + group.window_def_id + ' · ' + group.cycle_year;
  }

  function seasonalDetailDateLine(group, today) {
    if (today < group.effective_open) return 'Počinje ' + formatDateYmd(group.effective_open);
    if (today <= group.effective_close) {
      if (daysBetweenYmd(today, group.effective_close) < CLOSING_SOON_THRESHOLD_DAYS) return 'Aktualno do ' + formatDateYmd(group.effective_close) + ' - pri kraju.';
      return 'Aktualno od ' + formatDateYmd(group.effective_open) + ' do ' + formatDateYmd(group.effective_close);
    }
    return 'Bilo je aktualno od ' + formatDateYmd(group.effective_open) + ' do ' + formatDateYmd(group.effective_close);
  }

  function stateDisplayLabel(state) {
    if (state === 'open') return 'Aktualno';
    if (state === 'closing-soon') return 'Pri kraju';
    if (state === 'upcoming') return 'Uskoro';
    if (state === 'missed') return 'Bilo je aktualno';
    if (state === 'done') return 'Napravljeno';
    if (state === 'done_late') return 'Napravljeno nakon razdoblja';
    if (state === 'skipped') return 'Preskočeno';
    return state || '';
  }

  function seasonalDetailStateLine(group) {
    var order = ['open','closing-soon','missed','done','done_late','skipped','upcoming'];
    var present = Object.create(null);
    for (var i = 0; i < group.occurrences.length; i++) present[group.occurrences[i].state] = true;
    var labels = [];
    for (var s = 0; s < order.length; s++) {
      if (present[order[s]]) labels.push(stateDisplayLabel(order[s]));
    }
    return labels.length > 0 ? 'Stanje: ' + labels.join(', ') + '.' : '';
  }

  function uniformGateState(group) {
    if (group.occurrences.length === 0) return '';
    var gate = gateStateForDisplay(group.def, group.occurrences[0].gate_state);
    if (!gate) return '';
    for (var i = 1; i < group.occurrences.length; i++) {
      if (gateStateForDisplay(group.occurrences[i].def, group.occurrences[i].gate_state) !== gate) return '';
    }
    return gate;
  }

  function gateStateForDisplay(def, gateState) {
    if (!isPlainObject(def) || !hasOwnKey(def, 'open_condition')) return '';
    if (!gateState || gateState === 'ne primjenjuje se') return '';
    return gateState;
  }

  function seasonalDetailPlantScopeLine(group) {
    if (group.occurrences.length === 1) return 'Primjenjuje se na ' + plantTitle(group.occurrences[0].plant) + '.';
    return 'Primjenjuje se na ' + plantCountText(group.occurrences.length) + '.';
  }

  function seasonalDetailEvidenceSummary(group) {
    var stats = groupStats(group);
    if (stats.evidenced === 0) {
      if (stats.missed === stats.total) return 'Nema evidencije za ' + plantCountText(stats.total) + '.';
      return '';
    }
    if (stats.evidenced === stats.total) {
      if (stats.done === stats.total) return 'Odrađeno za sve voćke.';
      if (stats.skipped === stats.total) return 'Preskočeno za sve voćke.';
      return 'Evidentirano za sve voćke.';
    }
    if (stats.done === stats.evidenced) return 'Odrađeno za ' + evidenceFraction(stats.done, stats.total) + '.';
    if (stats.skipped === stats.evidenced) return 'Preskočeno za ' + evidenceFraction(stats.skipped, stats.total) + '.';
    return 'Evidentirano za ' + evidenceFraction(stats.evidenced, stats.total) + '.';
  }

  function matchingActivityEntriesForOccurrence(entries, occurrence) {
    var matches = [];
    for (var i = 0; i < entries.length; i++) {
      var effective = entries[i].effective;
      if (effective.plant_id !== occurrence.plant_id) continue;
      if (effective.window_def_id !== occurrence.window_def_id) continue;
      if (effective.catalog_version !== occurrence.catalog_version) continue;
      if (effective.occurred_on < occurrence.effective_open) continue;
      if (effective.occurred_on >= occurrence.next_effective_open) continue;
      matches.push(entries[i]);
    }
    return matches.sort(entrySort);
  }

  function activityEvidenceLine(entry, occurrence) {
    var effective = entry.effective;
    var text = effective.status === 'skipped' ? 'Preskočeno ' : 'Evidentirano ';
    text += formatDateYmd(effective.occurred_on);
    if (effective.status === 'done' && effective.occurred_on > occurrence.effective_close) text += ' nakon razdoblja';
    if (entry.corrected) text += ' ispravljeno';
    if (text.slice(-1) !== '.') text += '.';
    return text;
  }

  function noActivityEvidenceLine(occurrence, snapshot) {
    if (occurrence.state === 'upcoming') return 'Još nije aktualno';
    if (plantOccurrenceIsCurrent(snapshot, occurrence)) return 'Nije evidentirano';
    return 'Nema evidencije';
  }

  function canonicalTextLines(value) {
    if (typeof value !== 'string') return [];
    return value.split('\n').map(function (line) { return line.trim(); }).filter(function (line) { return line.length > 0; });
  }

  function appendCanonicalTextSection(parent, title, lines) {
    if (lines.length === 0) return;
    var section = makeEl('section', 'v2-seasonal-section');
    section.appendChild(makeEl('h3', '', title));
    var list = document.createElement('ul');
    for (var i = 0; i < lines.length; i++) {
      list.appendChild(makeEl('li', '', lines[i]));
    }
    section.appendChild(list);
    parent.appendChild(section);
  }

  function isSprayActionType(actionType) {
    return actionType === 'oil' || actionType === 'copper' || actionType === 'fungicide' || actionType === 'insecticide';
  }

  function renderSeasonalReadFailure(parent, result) {
    if (result.error.indexOf('.action_type') !== -1 || result.error.indexOf('cross-year') !== -1 || result.error.indexOf('month_day') !== -1) {
      console.error('vocnjak: V2 seasonal snapshot validation failed:', result.error);
      parent.appendChild(makeEl('p', 'v2-plants-error', SEASONAL_SNAPSHOT_ERROR_TEXT));
      return;
    }
    parent.appendChild(makeEl('p', 'v2-plants-error', result.error));
  }

  function renderSeasonalSnapshotFailure(parent, error) {
    console.error('vocnjak: V2 seasonal snapshot failed:', error && error.seasonalDetails ? error.seasonalDetails : error);
    parent.appendChild(makeEl('p', 'v2-plants-error', SEASONAL_SNAPSHOT_ERROR_TEXT));
  }

  // V2_PREGLED_HERO_MONTH_QUALIFIER_HR — hero display copy only.
  // Zagreb / continental baseline visual labels for the Pregled month chip.
  // Must NOT be used for scheduling, phenology logic, urgency, plant-state
  // decisions, action-window timing, or recommendations. Visual copy only.

    'zima','kasna zima','rano proljeće','proljeće','kasno proljeće','rano ljeto',
    'ljeto','kasno ljeto','rana jesen','jesen','kasna jesen','rana zima'
  ];

  function buildHeroStatusElement(snapshot, displayGroups) {
    var text = seasonalStatusSentence(snapshot, displayGroups);
    var p = makeEl('p', 'v2-pregled-status');
    var current = countCurrentGroups(displayGroups);

    if (idx === -1) { p.textContent = text; return p; }

    p.appendChild(makeEl('span', 'v2-pregled-status-accent', accent));
    p.appendChild(document.createTextNode(text.slice(idx + accent.length)));

  function appendPregledHero(parent, snapshot, displayGroups) {

        '<path d="M212 50 L212 32 M212 38 L206 32 M212 40 L218 32 M212 44 L208 38 M212 46 L216 38" stroke="#0e2632" stroke-width="1.2" stroke-linecap="round"/>' +

      '</svg>';
